<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>三国狼人杀</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#1a1a2e;--bg2:#16213e;--card:#0f3460;--gold:#e2b714;--red:#c0392b;--blue:#2980b9;--green:#27ae60;--purple:#8e44ad;--white:#ecf0f1;--gray:#7f8c8d;--dark:#2c3e50;--wolf:#c0392b;--seer:#3498db;--witch:#9b59b6;--hunter:#e67e22;--guard:#2ecc71;--villager:#95a5a6}
body{font-family:'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--white);min-height:100vh;overflow-x:hidden}
.header{text-align:center;padding:20px;background:linear-gradient(135deg,var(--bg2),var(--card));border-bottom:2px solid var(--gold)}
.header h1{font-size:28px;color:var(--gold);text-shadow:0 0 10px rgba(226,183,20,0.3)}
.header p{color:var(--gray);font-size:14px;margin-top:4px}
.phase-bar{display:flex;justify-content:center;gap:4px;padding:12px;background:var(--bg2)}
.phase-dot{width:12px;height:12px;border-radius:50%;background:var(--gray);opacity:0.3;transition:all 0.3s}
.phase-dot.active{opacity:1;box-shadow:0 0 8px currentColor}
.game-area{max-width:900px;margin:0 auto;padding:20px;display:flex;gap:20px}
.players-panel{flex:0 0 280px}
.game-main{flex:1;min-width:0}
.card{background:var(--bg2);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:16px;margin-bottom:12px}
.card h3{color:var(--gold);font-size:14px;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.player-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.p-card{background:var(--card);border-radius:10px;padding:8px;text-align:center;cursor:pointer;transition:all 0.3s;border:2px solid transparent;position:relative}
.p-card:hover{transform:translateY(-2px);border-color:var(--gold)}
.p-card.dead{opacity:0.4;pointer-events:none;filter:grayscale(1)}
.p-card.selected{border-color:var(--gold);box-shadow:0 0 12px rgba(226,183,20,0.4)}
.p-card.wolf-glow{border-color:var(--wolf);box-shadow:0 0 12px rgba(192,57,43,0.4)}
.p-card .avatar{width:40px;height:40px;border-radius:50%;margin:0 auto 4px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;overflow:hidden;background:var(--card)}
.p-card .avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.p-card .name{font-size:12px;font-weight:700}
.p-card .faction{font-size:10px;color:var(--gray)}
.p-card .role-badge{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;font-size:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700}
.p-card .status-icon{position:absolute;top:4px;left:4px;font-size:10px}
.faction-wei .avatar{background:linear-gradient(135deg,#1a5276,#2980b9)}
.faction-shu .avatar{background:linear-gradient(135deg,#145a32,#27ae60)}
.faction-wu .avatar{background:linear-gradient(135deg,#7d3c98,#a569bd)}
.faction-qun .avatar{background:linear-gradient(135deg,#935116,#d4ac0d)}
.log-area{max-height:400px;overflow-y:auto;padding:8px}
.log-entry{padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.05);font-size:13px;line-height:1.6;animation:fadeIn 0.3s}
.log-entry .speaker{color:var(--gold);font-weight:700;margin-right:4px}
.log-entry .night-text{color:var(--gray);font-style:italic}
.log-entry .death-text{color:var(--red)}
.log-entry .vote-text{color:var(--blue)}
.log-entry .system-text{color:var(--purple);font-weight:700}
@keyframes fadeIn{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:translateY(0)}}
.action-bar{padding:12px;text-align:center}
.action-bar button{padding:10px 24px;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;transition:all 0.2s;margin:0 4px}
.action-bar button:hover{transform:scale(1.05)}
.action-bar button:disabled{opacity:0.4;cursor:not-allowed;transform:none}
.btn-primary{background:var(--gold);color:var(--bg)}
.btn-danger{background:var(--red);color:#fff}
.btn-blue{background:var(--blue);color:#fff}
.btn-green{background:var(--green);color:#fff}
.btn-purple{background:var(--purple);color:#fff}
.btn-pause{position:fixed;top:12px;right:12px;z-index:300;padding:8px 18px;border:2px solid var(--gold);border-radius:20px;background:rgba(15,52,96,0.95);color:var(--gold);font-size:13px;font-weight:700;cursor:pointer;transition:all 0.2s;backdrop-filter:blur(4px)}
.btn-pause:hover{background:var(--gold);color:var(--bg);transform:scale(1.05)}
.btn-pause.paused{border-color:var(--red);color:var(--red)}
.btn-pause.paused:hover{background:var(--red);color:#fff}
.btn-settings{position:fixed;top:12px;right:120px;z-index:300;padding:8px 18px;border:2px solid var(--gold);border-radius:20px;background:rgba(15,52,96,0.95);color:var(--gold);font-size:13px;font-weight:700;cursor:pointer;transition:all 0.2s;backdrop-filter:blur(4px)}
.btn-settings:hover{background:var(--gold);color:var(--bg);transform:scale(1.05)}
.speed-panel{position:fixed;top:56px;right:80px;z-index:400;background:rgba(22,33,62,0.98);border:2px solid var(--gold);border-radius:12px;padding:16px;backdrop-filter:blur(8px);display:none;flex-direction:column;gap:8px;min-width:160px}
.speed-panel.show{display:flex}
.btn-favor{position:fixed;top:12px;left:12px;z-index:300;padding:8px 18px;border:2px solid var(--purple);border-radius:20px;background:rgba(15,52,96,0.95);color:var(--purple);font-size:13px;font-weight:700;cursor:pointer;transition:all 0.2s;backdrop-filter:blur(4px)}
.btn-favor:hover{background:var(--purple);color:#fff;transform:scale(1.05)}
.speed-panel h4{color:var(--gold);font-size:13px;margin-bottom:4px;text-align:center}
.speed-btns{display:flex;gap:6px;justify-content:center}
.speed-btn{padding:6px 14px;border:1px solid rgba(255,255,255,0.2);border-radius:8px;background:transparent;color:var(--gray);font-size:13px;font-weight:600;cursor:pointer;transition:all 0.15s}
.speed-btn:hover{border-color:var(--gold);color:var(--white)}
.speed-btn.active{background:var(--gold);color:var(--bg);border-color:var(--gold)}
.favor-panel{position:fixed;top:56px;left:12px;z-index:400;background:rgba(22,33,62,0.98);border:2px solid var(--purple);border-radius:12px;padding:14px;backdrop-filter:blur(8px);display:none;flex-direction:column;gap:6px;max-width:calc(100vw - 24px);width:max-content;max-height:75vh;overflow-y:auto;overflow-x:auto;color:var(--white);font-size:13px}
.favor-panel.show{display:flex}
.favor-panel h4{color:var(--purple);font-size:13px;margin-bottom:4px;text-align:center}
.favor-panel .fp-hint{color:var(--gray);font-size:11px;text-align:center;margin-bottom:4px}
.favor-grid{display:grid;gap:2px;font-size:11px;width:max-content}
.favor-grid-hdr{display:grid;grid-template-columns:64px repeat(15,28px);gap:2px;margin-bottom:2px}
.favor-grid-hdr span{color:var(--gray);text-align:center;font-weight:700;font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;width:28px}
.favor-grid-hdr span:first-child{text-align:right;padding-right:4px;width:64px}
.favor-row{display:grid;grid-template-columns:64px repeat(15,28px);gap:2px;align-items:center}
.favor-row .fp-name{text-align:right;padding-right:4px;font-weight:700;font-size:10px;color:var(--white);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;width:64px}
.favor-cell{text-align:center;border-radius:3px;padding:1px 0;font-size:9px;font-weight:600;cursor:pointer;transition:all 0.15s;width:28px;height:20px;display:flex;align-items:center;justify-content:center;box-sizing:border-box}
.favor-cell:hover{transform:scale(1.2);z-index:1;box-shadow:0 0 6px rgba(255,255,255,0.3)}
.favor-cell.dead{opacity:0.25;cursor:default}
.favor-cell.dead:hover{transform:none;box-shadow:none}
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;z-index:100}
.modal{background:var(--bg2);border:2px solid var(--gold);border-radius:16px;padding:24px;max-width:500px;width:90%;text-align:center}
.modal h2{color:var(--gold);font-size:22px;margin-bottom:12px}
.modal p{color:var(--white);font-size:14px;line-height:1.8;margin-bottom:16px}
.modal .highlight{color:var(--gold);font-weight:700}
.role-reveal{text-align:center;padding:20px}
.role-reveal .role-icon{font-size:48px;margin-bottom:12px}
.role-reveal .role-name{font-size:24px;font-weight:700;margin-bottom:8px}
.role-reveal .role-desc{color:var(--gray);font-size:14px}
.vote-result{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.vote-tag{background:rgba(255,255,255,0.1);border-radius:4px;padding:2px 8px;font-size:12px}
.night-overlay{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:50;transition:background 1s}
.night-overlay.is-night{background:rgba(0,0,10,0.5)}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--gold);border-radius:8px;padding:10px 20px;font-size:14px;z-index:200;animation:toastIn 0.3s}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(-20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.witch-panel{text-align:left}
.witch-panel h4{margin:8px 0 4px;color:var(--gold);font-size:13px}
.witch-options{display:flex;gap:8px;flex-wrap:wrap}
.witch-btn{padding:6px 14px;border-radius:6px;border:1px solid var(--gold);background:transparent;color:var(--gold);cursor:pointer;font-size:13px}
.witch-btn:hover{background:var(--gold);color:var(--bg)}
.witch-btn.used{opacity:0.3;pointer-events:none}
.info-bar{display:flex;justify-content:space-between;padding:8px 12px;background:var(--bg2);border-radius:8px;font-size:13px;margin-bottom:12px}
.info-bar span{color:var(--gray)}
.info-bar .num{color:var(--gold);font-weight:700}
.speaker{display:inline-flex;align-items:center;gap:6px;vertical-align:middle;font-weight:700;margin-right:4px}
.speaker img{width:28px;height:28px;border-radius:50%;border:2px solid rgba(255,255,255,0.2);object-fit:cover;flex-shrink:0;background:var(--card)}

/* ===== 移动端适配 ===== */
@media(max-width:768px){
  .header{padding:14px}
  .header h1{font-size:22px}
  .header p{font-size:12px}
  .phase-bar{padding:8px}
  .game-area{flex-direction:column;padding:10px;gap:12px}
  .players-panel{flex:none;width:100%}
  .player-grid{grid-template-columns:repeat(5,1fr);gap:6px}
  .p-card{padding:6px}
  .p-card .avatar{width:32px;height:32px;font-size:14px}
  .p-card .name{font-size:10px}
  .p-card .faction{font-size:9px}
  .p-card .role-badge{width:16px;height:16px;font-size:8px;top:-4px;right:-4px}
  .p-card .status-icon{font-size:8px}
  .log-area{max-height:45vh;font-size:12px}
  .log-entry{font-size:12px;line-height:1.5}
  .speaker img{width:22px;height:22px;border-width:1px}
  .card{padding:10px;margin-bottom:8px}
  .card h3{font-size:12px}
  .action-bar button{padding:8px 16px;font-size:13px}
  .info-bar{font-size:11px;padding:6px 8px}
  .btn-pause{top:8px;right:8px;padding:6px 14px;font-size:12px}
  .btn-settings{top:8px;right:100px;padding:6px 14px;font-size:12px}
  .btn-favor{top:8px;left:8px;padding:6px 14px;font-size:12px}
  .speed-panel{top:48px;right:60px;padding:12px;min-width:140px}
  .favor-panel{top:48px;left:8px;max-height:60vh;padding:10px}
  .modal{padding:16px;width:92%}
  .modal h2{font-size:18px}
  .modal p{font-size:13px}
  .role-reveal .role-icon{font-size:36px}
  .role-reveal .role-name{font-size:20px}
}
.tag-conservative{color:var(--gray);font-size:11px;font-style:italic}
.tag-attack{color:#e67e22;font-size:11px;font-weight:700}
.tag-shield{color:var(--green);font-size:11px;font-weight:700}
.tag-break{color:var(--red);font-size:11px;font-weight:700;text-shadow:0 0 6px rgba(192,57,43,0.4)}
</style>
</head>
<body>
<div class="night-overlay" id="nightOverlay"></div>
<button class="btn-favor" id="favorBtn" onclick="openFavorPanel()">♡ 好感度</button>
<button class="btn-settings" id="settingsBtn" onclick="openSettings()">⚙ 设置</button>
<button class="btn-pause" id="pauseBtn" onclick="togglePause()">⏸ 暂停</button>
<div class="speed-panel" id="speedPanel">
  <h4>游戏速度</h4>
  <div class="speed-btns">
    <button class="speed-btn" onclick="setSpeed(0.5)">0.5x</button>
    <button class="speed-btn active" onclick="setSpeed(1)">1x</button>
    <button class="speed-btn" onclick="setSpeed(2)">2x</button>
    <button class="speed-btn" onclick="setSpeed(3)">3x</button>
  </div>
</div>
<div class="favor-panel" id="favorPanel">
  <h4>好感度面板（上帝视角）</h4>
  <div class="fp-hint">点击数值可手动修改 · 滚轮调整</div>
  <div id="favorGrid" class="favor-grid"></div>
</div>
<div class="header">
  <h1>三 国 狼 人 杀</h1>
  <p>从219位三国豪杰中随机选拔15人进行智谋对决</p>
</div>
<div class="phase-bar" id="phaseBar"></div>
<div class="game-area">
  <div class="players-panel">
    <div class="card">
      <h3>Players</h3>
      <div class="player-grid" id="playerGrid"></div>
    </div>
    <div class="info-bar" id="infoBar"></div>
  </div>
  <div class="game-main">
    <div class="card">
      <h3>Game Log</h3>
      <div class="log-area" id="logArea"></div>
    </div>
    <div class="action-bar" id="actionBar"></div>
  </div>
</div>
<div id="modalArea"></div>

<script src="characters_data.js"></script>
<script>
const FACTION_DIR = {"魏":"avatars/wei","蜀":"avatars/shu","吴":"avatars/wu","群雄":"avatars/qun"};
const ALL_CHARS = typeof ALL_CHARACTERS !== 'undefined' ? ALL_CHARACTERS : [];

// 人设特有发言索引：按角色名，运行时动态生成
const PERSONAL_SPEECHES={};

const ROLE_CFG={wolf:{name:"狼人",color:"var(--wolf)",icon:"W",desc:"每晚与同伴商议杀害一人",count:4},seer:{name:"预言家",color:"var(--seer)",icon:"P",desc:"每晚可查验一人的身份",count:1},witch:{name:"女巫",color:"var(--witch)",icon:"N",desc:"拥有一瓶解药和一瓶毒药",count:1},hunter:{name:"猎人",color:"var(--hunter)",icon:"L",desc:"死亡时可带走一人",count:1},guard:{name:"守卫",color:"var(--guard)",icon:"S",desc:"每晚可保护一人免死",count:1},villager:{name:"平民",color:"var(--villager)",icon:"M",desc:"白天投票放逐嫌疑人",count:7}};

// ===== 说话模板：生动、人设化、带吐槽和情绪 =====
const SPEECH_TEMPLATES={
wolf_accuse:[
  "我操，{t}这货刚才一直不敢看人，心虚成这样还好意思坐在这？我怀疑就是他！",
  "{t}你跟我搁这演呢？发言跟便秘似的半天憋不出一句有用的，不是狼人是什么？",
  "各位别被{t}忽悠了，此人前天还信誓旦旦说某某是好人，结果人没了。这种人靠得住？",
  "我的天，{t}这发言水平，跟曹爽有得一拼。你当大家都是傻子吗？我怀疑{t}就是狼！",
  "{t}你别搁这装好人了，你那点小心思我一眼就看穿了。投{t}！",
  "讲真，{t}说话支支吾吾的，要么是没脑子的蠢货，要么就是心虚的狼人，不管哪个都该投。",
  "我真是服了，{t}你能不能说点有用的？空话套话一大堆，你搁这做演讲呢？",
  "曹操说过，对酒当歌人生几何。但{t}你今天这表现，只让人觉得你该去地下对酒去了。",
  "{t}这发言，我都替他尴尬。东拉西扯不知所云，不是狼是什么？",
  "妈的，{t}你自己心里没点数吗？你那发言把你自己的底都露完了！"
],
wolf_defend:[
  "我靠，你们投我？我真的冤得一批，我连狼人长啥样都不知道！",
  "行吧，你们要冤枉好人我也没办法。但我要说，投错人的代价你们自己承担。",
  "我真是日了狗了，被人当替罪羊的感觉真不爽。投我可以，但你们别后悔。",
  "说我可疑？好，那我倒要问问，比我更可疑的那几个人你们怎么不投？双标啊！"
],
seer_reveal:[
  "别吵了！我是预言家！昨晚我查验了{t}——这货就是狼人！不信拉倒，我的命你们看着办！",
  "各位听我说一句！我昨晚偷偷查了{t}，结果让我毛骨悚然——他、就、是、狼！",
  "重要情报！我预言家身份不保也要说——{t}是狼人！昨晚验的，千真万确！谁再帮他说话谁就有问题！"
],
seer_hint:[
  "我手里有料，但暂时不方便全说。只能提示大家一句：盯紧{t}，这个人不对劲。",
  "我有一种强烈的直觉——{t}有问题。具体证据我先不透露，但我建议大家先从{t}身上下手。",
  "有些事点到为止，但我相信{t}的底细早晚会被揭穿。大家注意观察他接下来的反应。"
],
hunter_threat:[
  "我就一句话：谁敢投我，我走的时候绝对拉一个垫背的。你自己掂量掂量。",
  "别以为我没牌。真把我逼急了，我让你知道什么叫同归于尽。狼人你掂量着办。",
  "我不是吓唬谁，我这人有能力让一个人跟我一起走。投我之前先想想值不值。",
  "呵，想动我？好大的胆子。我倒要看看谁有这个勇气。"
],
guard_claim:[
  "昨晚我守了一个人，所以大家看到了，没人出局。我的保护还在继续，狼人你别想得逞。",
  "放心，有人在暗中守护着你们。但我的保护是有限的，大家自己也要动脑子。",
  "我能做的都做了。但光靠我一个人守不住所有人，大家得自己判断。"
],
villager_analyze:[
  "我仔细听了所有人的发言，{t}的逻辑问题最大——他自己说的前后矛盾，大家注意到了吗？",
  "说实话，{t}今天这番话让我很不舒服。感觉像在带节奏，试图转移大家注意力。",
  "我没啥特殊能力，就是个平民。但以我的直觉来看，{t}这人不可信。感觉他一直在刻意隐藏什么。",
  "我感觉{t}一直在装傻。真正的好人不会故意含糊其辞，只有狼人才需要这样。",
  "我跟你们说，{t}今天的发言完全是照着剧本念的。一个正常人说话不会这么刻意。",
  "我真的想吐槽，{t}你能不能别搁这搅浑水了？越搅越乱对你有好处是吧？"
],
witch_save:[
  "昨晚有人差点死了，我出手救了。别问我是谁，也别问救的是谁。总之人还在。",
  "我犹豫了很久，但还是用了我的解药。希望这个人之后能证明自己值得我救。"
],
witch_poison:[
  "我受够了{t}的表演了，今晚毒药伺候。你不是爱演吗？演到阴曹地府去吧。",
  "经过仔细观察，我确信{t}就是狼人。毒药出手，绝不虚发。大家等着看好消息吧。",
  "我不想再等了。{t}每多活一天好人就多危险一天。今晚我做了决定。"
],
vote_reason:[
  "投{t}，没什么好犹豫的。",
  "{t}最可疑，投了。",

// 初始化好感度
function initFavor() {
  for (const p of game.players) {
    p.favor = {};
    for (const other of game.players) {
      if (other.id === p.id) continue;
      if (p.faction === other.faction) {
        p.favor[other.id] = 55; // 同阵营55
      } else {
        p.favor[other.id] = 50; // 不同阵营50
      }
    }
  }
  // 特殊关系：同阵营中随机配对给予60~65
  const factions = {};
  for (const p of game.players) {
    if (!factions[p.faction]) factions[p.faction] = [];
    factions[p.faction].push(p);
  }
  for (const f in factions) {
    const members = factions[f];
    // 每对同阵营的人有 30% 概率建立特殊关系
    for (let i = 0; i < members.length; i++) {
      for (let j = i + 1; j < members.length; j++) {
        if (Math.random() < 0.3) {
          const bonus = 60 + Math.floor(Math.random() * 6); // 60~65
          members[i].favor[members[j].id] = bonus;
          members[j].favor[members[i].id] = bonus;
        }
      }
    }
  }
}

// 获取好感度（安全访问）
function getFavor(from, toId) {
  return (from.favor && from.favor[toId]) || 50;
}

// 设置好感度（clamp 0~100）
function setFavor(from, toId, value) {
  if (!from.favor) from.favor = {};
  from.favor[toId] = Math.max(0, Math.min(100, value));
}

// 分类发言类型
function classifySpeech(speech, speaker, alive) {
  if (!speech || speech.length === 0) return { type: 'conservative', subtype: null, targets: [] };

  const others = alive.filter(x => x.id !== speaker.id);

  // 决裂式关键词
  const breakBadKeywords = ['确信.*是狼', '就是狼人', '绝对是狼', '百分之百是狼', '千真万确.*狼'];
  const breakGoodKeywords = ['确信.*是好人', '就是好人', '绝对是好人', '百分之百是好人', '千真万确.*好人'];
  const breakIdentityKeywords = ['我是预言家', '预言家身份', '我预言家'];

  // 检查决裂式
  for (const kw of breakBadKeywords) {
    if (new RegExp(kw).test(speech)) {
      const target = others.find(x => speech.includes(x.name) && new RegExp(kw).test(speech));
      return { type: 'break', subtype: 'accuse', targets: target ? [target] : [] };
    }
  }
  for (const kw of breakGoodKeywords) {
    if (new RegExp(kw).test(speech)) {
      const target = others.find(x => speech.includes(x.name) && new RegExp(kw).test(speech));
      return { type: 'break', subtype: 'defend', targets: target ? [target] : [] };
    }
  }
  for (const kw of breakIdentityKeywords) {
    if (new RegExp(kw).test(speech)) {
      const target = others.find(x => speech.includes(x.name));
      return { type: 'break', subtype: 'accuse', targets: target ? [target] : [] };
    }
  }

  // 检查主动进攻：怀疑/指控
  const attackKeywords = ['怀疑', '可疑', '有问题', '不对劲', '逻辑问题', '带节奏', '搅浑水', '投他', '投吧', '不对', '心虚', '不顺眼', '有毛病', '装', '废话', '不是好人', '就投他', '该投', '该死', '不可信', '不靠谱', '不正常', '演戏', '精心准备', '不可靠', '装傻', '装好人', '胡说', '瞎说', '忽悠', '别装了', '侮辱', '反常', '表现最', '最反常', '刻意', '剧本', '照着', '前后矛盾', '含糊'];
  let attackedTargets = [];
  for (const x of others) {
    if (speech.includes(x.name)) {
      const afterName = speech.split(x.name);
      for (const seg of afterName) {
        if (attackKeywords.some(kw => seg.includes(kw))) {
          attackedTargets.push(x);
          break;
        }
        // 检测"投+人名"模式：片段以"投"字结尾，说明原文是"投XX"
        if (/(?:投|票|出局|查)[\s，。！？]*$/.test(seg)) {
          attackedTargets.push(x);
          break;
        }
      }
    }
  }

  // 检查主动进攻：袒护
  const defendKeywords = ['没问题', '是好人', '不是狼', '信任', '没问题', '不要投'];
  let defendedTargets = [];
  for (const x of others) {
    if (speech.includes(x.name) && !attackedTargets.includes(x)) {
      const afterName = speech.split(x.name);
      for (const seg of afterName) {
        if (defendKeywords.some(kw => seg.includes(kw))) {
          defendedTargets.push(x);
          break;
        }
      }
    }
  }

  if (attackedTargets.length > 0) {
    return { type: 'attack', subtype: 'suspect', targets: attackedTargets };
  }
  if (defendedTargets.length > 0) {
    return { type: 'attack', subtype: 'shield', targets: defendedTargets };
  }

  // Fallback：未点名具体玩家，但发言含强攻击性词汇 → 也算主动进攻（无特定目标）
  const genericAttackWords = ['不可信', '不靠谱', '不正常', '演戏', '精心准备', '装好人', '忽悠', '侮辱', '带节奏', '搅浑水', '有毛病', '心虚', '不对劲', '反常', '有问题', '刻意', '剧本', '照着', '前后矛盾', '装傻', '含糊'];
  if (genericAttackWords.some(kw => speech.includes(kw))) {
    return { type: 'attack', subtype: 'suspect', targets: [] };
  }

  return { type: 'conservative', subtype: null, targets: [] };
}

// 发言类型标签（用于日志显示）
function speechTypeLabel(classified) {
  switch (classified.type) {
    case 'conservative': return '<span class="tag-conservative">（划水）</span>';
    case 'attack':
      if (classified.subtype === 'suspect') {
        const names = classified.targets.map(t => t.name).join('、');
        return names ? `<span class="tag-attack">（怀疑${names}）</span>` : '';
      } else {
        const names = classified.targets.map(t => t.name).join('、');
        return names ? `<span class="tag-shield">（袒护${names}）</span>` : '';
      }
    case 'break':
      if (classified.subtype === 'accuse') {
        const names = classified.targets.map(t => t.name).join('、');
        return `<span class="tag-break">（确信${names}是狼）</span>`;
      } else {
        const names = classified.targets.map(t => t.name).join('、');
        return `<span class="tag-break">（确信${names}是好人）</span>`;
      }
    default: return '';
  }
}

// 计算好感度变化幅度（规则③④⑦）
function calcFavorChange(baseChange, speaker, listener) {
  let multiplier = 1 + (getAttr(speaker, '智谋') - 3) * 0.15;
  if (getAttr(speaker, '统帅') >= 4) multiplier *= 1.3;
  let resistMultiplier = 1 - (getAttr(listener, '意志') - 3) * 0.1;
  resistMultiplier = Math.max(0.5, resistMultiplier);
  return Math.round(baseChange * multiplier * resistMultiplier);
}

// 计算 miss 概率
function calcMissChance(listenerFavor, speaker, listener, speechType) {
  let missChance = 0.5 * Math.exp(-(listenerFavor * listenerFavor) / 2500);
  missChance -= (getAttr(listener, '智谋') - 3) * 0.04;
  missChance -= (getAttr(listener, '魅力') - 3) * 0.03;
  missChance -= (getAttr(speaker, '智谋') - 3) * 0.03;
  missChance -= (getAttr(speaker, '魅力') - 3) * 0.02;
  if (speechType === 'attack') missChance += (getAttr(listener, '意志') - 3) * 0.03;
  if (speechType === 'break') missChance += (getAttr(listener, '武力') - 3) * 0.02;
  return Math.max(0, Math.min(0.6, missChance));
}

// 规则⑥ 魅力修正反效果阈值
function getAntiEffectThresholds(speaker) {
  const charm = getAttr(speaker, '魅力');
  // 魅力越高，反效果触发越难（阈值偏移）
  const charmBonus = (charm - 3) * 2.5;
  return {
    highThreshold: 70 + charmBonus,   // 默认70，魅力5时=77.5
    lowThreshold: 30 - charmBonus      // 默认30，魅力5时=22.5
  };
}

// 应用发言对好感度的影响
function applySpeechFavorEffect(speaker, speech, classified, listeners, isNight) {
  const changes = []; // 记录好感度变化，用于日志

  for (const listener of listeners) {
    if (listener.id === speaker.id) continue;

    const favor = getFavor(listener, speaker.id);
    const missChance = calcMissChance(favor, speaker, listener, classified.type);

    // miss 判定
    if (Math.random() < missChance) continue;

    const thresholds = getAntiEffectThresholds(speaker);
    let change = 0;

    switch (classified.type) {
      case 'conservative':
        if (favor < 30) {
          change = -1; // 觉得在躲
        } else {
          change = 1;
        }
        break;

      case 'attack': {
        if (classified.subtype === 'suspect') {
          // 对被怀疑者
          if (classified.targets.some(t => t.id === listener.id)) {
            change = calcFavorChange(-(3 + Math.floor(Math.random() * 3)), speaker, listener);
          }
          // 对发言者（反效果检查：听者对被怀疑者好感度≥阈值）
          else {
            const targetFavor = classified.targets.length > 0 ? getFavor(listener, classified.targets[0].id) : 50;
            if (targetFavor >= thresholds.highThreshold) {
              change = calcFavorChange(-(2 + Math.floor(Math.random() * 3)), speaker, listener);
            } else {
              change = calcFavorChange(2 + Math.floor(Math.random() * 3), speaker, listener);
            }
          }
        } else if (classified.subtype === 'shield') {
          if (classified.targets.some(t => t.id === listener.id)) {
            change = calcFavorChange(2 + Math.floor(Math.random() * 3), speaker, listener);
          } else {
            const targetFavor = classified.targets.length > 0 ? getFavor(listener, classified.targets[0].id) : 50;
            if (targetFavor < thresholds.lowThreshold) {
              change = calcFavorChange(-(2 + Math.floor(Math.random() * 2)), speaker, listener);
            } else {
              change = calcFavorChange(1 + Math.floor(Math.random() * 3), speaker, listener);
            }
          }
        }
        break;
      }

      case 'break': {
        if (classified.subtype === 'accuse') {
          if (classified.targets.some(t => t.id === listener.id)) {
            change = calcFavorChange(-(5 + Math.floor(Math.random() * 4)), speaker, listener);
          } else {
            const targetFavor = classified.targets.length > 0 ? getFavor(listener, classified.targets[0].id) : 50;
            if (targetFavor >= thresholds.highThreshold) {
              change = calcFavorChange(-(5 + Math.floor(Math.random() * 4)), speaker, listener);
            } else if (favor < 25) {
              // 反效果：被指控者好感度提升
              for (const t of classified.targets) {
                const oldF = getFavor(listener, t.id);
                setFavor(listener, t.id, oldF + calcFavorChange(5 + Math.floor(Math.random() * 4), speaker, listener));
              }
              change = 0;
            } else {
              change = calcFavorChange(3 + Math.floor(Math.random() * 3), speaker, listener);
            }
          }
        } else if (classified.subtype === 'defend') {
          if (classified.targets.some(t => t.id === listener.id)) {
            change = calcFavorChange(5 + Math.floor(Math.random() * 4), speaker, listener);
          } else {
            const targetFavor = classified.targets.length > 0 ? getFavor(listener, classified.targets[0].id) : 50;
            if (targetFavor < 25) {
              change = calcFavorChange(-(3 + Math.floor(Math.random() * 3)), speaker, listener);
            } else {
              change = calcFavorChange(2 + Math.floor(Math.random() * 3), speaker, listener);
            }
          }
        }
        break;
      }
    }

    if (change !== 0) {
      const oldFavor = getFavor(listener, speaker.id);
      setFavor(listener, speaker.id, oldFavor + change);
      changes.push({ listener, change, newFavor: getFavor(listener, speaker.id) });
    }
  }

  return changes;
}

function favorColor(v){

  if(v>=55) return '#2ecc71';
  if(v>=45) return '#e2b714';
  if(v>=30) return '#e67e22';
  return '#c0392b';
}
function favorBg(v){
  const c=favorColor(v);
  return c+'22';
}
function renderFavorGrid(){
  if(!game.players||!game.players.length)return;
  const container=document.getElementById('favorGrid');
  const ps=game.players;
  const n=ps.length;
  const colTemplate=`64px repeat(${n},28px)`;
  let html=`<div class="favor-grid-hdr" style="grid-template-columns:${colTemplate}"><span></span>`;
  for(const p of ps) html+=`<span title="${p.name}">${p.name.slice(0,2)}</span>`;
  html+='</div>';
  for(const row of ps){
    html+=`<div class="favor-row" style="grid-template-columns:${colTemplate}"><span class="fp-name" title="${row.name}">${row.name.slice(0,2)}</span>`;
    for(const col of ps){
      if(col.id===row.id){
        html+='<div class="favor-cell dead">-</div>';
      } else {
        const v=getFavor(row,col.id);
        const dead=!row.alive||!col.alive;
        const cls=dead?'favor-cell dead':'favor-cell';
        html+=`<div class="${cls}" style="color:${favorColor(v)};background:${favorBg(v)}" data-from="${row.id}" data-to="${col.id}" title="${row.name}→${col.name}: ${v}">${v}</div>`;
      }
    }
    html+='</div>';
  }
  container.innerHTML=html;
  container.querySelectorAll('.favor-cell:not(.dead)').forEach(cell=>{
    cell.addEventListener('wheel',function(e){
      e.preventDefault();
      const fid=parseInt(this.dataset.from);
      const tid=parseInt(this.dataset.to);
      const old=getFavor(game.players[fid],tid);
      const nv=Math.max(0,Math.min(100,old+(e.deltaY>0?-1:1)));
      setFavor(game.players[fid],tid,nv);
      this.textContent=nv;
      this.style.color=favorColor(nv);
      this.style.background=favorBg(nv);
      this.title=`${game.players[fid].name}→${game.players[tid].name}: ${nv}`;
    });
    cell.addEventListener('click',function(){
      const fid=parseInt(this.dataset.from);
      const tid=parseInt(this.dataset.to);
      const old=getFavor(game.players[fid],tid);
      const nv=prompt(`修改好感度\n${game.players[fid].name} → ${game.players[tid].name}`,old);
      if(nv!==null){
        const val=Math.max(0,Math.min(100,parseInt(nv)||0));
        setFavor(game.players[fid],tid,val);
        renderFavorGrid();
      }
    });
  });
}

function setSpeed(s){
  game.speed=s;
  document.querySelectorAll('.speed-btn').forEach(b=>{
    b.classList.toggle('active', parseFloat(b.textContent)===s);
  });
}

// 点击面板外部关闭
document.addEventListener('click',function(e){
  const panel=document.getElementById('speedPanel');
  const btn=document.getElementById('settingsBtn');
  if(panel.classList.contains('show') && !panel.contains(e.target) && !btn.contains(e.target)){
    closeSettings();
  }
  const fp=document.getElementById('favorPanel');
  const fb=document.getElementById('favorBtn');
  if(fp.classList.contains('show') && !fp.contains(e.target) && !fb.contains(e.target)){
    closeFavorPanel();
  }
});

function togglePause(){
  game.isPaused=!game.isPaused;
  const btn=document.getElementById("pauseBtn");
  if(game.isPaused){
    btn.textContent="▶ 继续";
    btn.classList.add("paused");
  } else {
    btn.textContent="⏸ 暂停";
    btn.classList.remove("paused");
    game._pausedByFavor=false;
    game.pauseResolvers.forEach(r=>r());
    game.pauseResolvers=[];
  }
}

function delay(ms){
  return new Promise(resolve=>{
    const actual=Math.round(ms/game.speed);
    const check=()=>{
      if(game.isPaused){
        game.pauseResolvers.push(()=>setTimeout(check,50));
      } else {
        setTimeout(resolve,actual);
      }
    };
    check();
  });
}

function init(){
  // 从 219 人的角色库中随机抽取 15 人
  const pool = shuffle([...ALL_CHARS]);
  const selected = pool.slice(0, 15);

  let roles=[];
  for(let r in ROLE_CFG) for(let i=0;i<ROLE_CFG[r].count;i++) roles.push(r);
  shuffle(roles);
  game.players = selected.map((c,i) => ({
    ...c,
    id: i,
    role: roles[i],
    alive: true,
    votedFor: null
  }));
  renderPlayers();
  initFavor();
  showStartModal();
}

function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function closeModal(){document.getElementById("modalArea").innerHTML=""}

function renderPlayers(){

  grid.innerHTML=game.players.map(p=>{
    const fc={"魏":"faction-wei","蜀":"faction-shu","吴":"faction-wu","群":"faction-qun"}[p.faction];

function plainText(html){ return html.replace(/<[^>]*>/g,''); }

function speakerHTML(player, label){
  const name = label || player.name;
  const faction = player.faction || "群雄";
  const color = player.faction==="魏"?"var(--blue)":player.faction==="蜀"?"var(--green)":player.faction==="吴"?"var(--purple)":"var(--gold)";
  const imgSrc = (FACTION_DIR[faction] || "avatars/qun") + '/' + player.name + '.png';
  return `<span class="speaker" style="color:${color}"><img src="${imgSrc}" onerror="this.style.display='none'" alt="${plainText(name)}">${name}：</span>`;
}

function addLog(html){
  const area=document.getElementById("logArea");
  const div=document.createElement("div");
  div.className="log-entry";
  div.innerHTML=html;
  area.appendChild(div);
  area.scrollTop=area.scrollHeight;
}

function setPhase(text,color){
  document.getElementById("phaseBar").innerHTML=`<div class="phase-dot active" style="color:${color};background:${color}"></div>
  <span style="color:${color};font-size:13px;font-weight:700;margin-left:8px">${text}</span>`;
}

function setNight(b){document.getElementById("nightOverlay").className="night-overlay"+(b?" is-night":"")}

function getAlive(){return game.players.filter(p=>p.alive)}
function getAliveGood(){return getAlive().filter(p=>p.role!=="wolf")}
function getAliveWolves(){return getAlive().filter(p=>p.role==="wolf")}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)]}
function pickExclude(arr,exclude){return pick(arr.filter(x=>!exclude.includes(x)))}

function pickTemplate(group,vars){
  let t=pick(SPEECH_TEMPLATES[group]||SPEECH_TEMPLATES.generic);
  for(let k in vars) t=t.replaceAll(`{${k}}`,vars[k]);
  return t;
}

async function startGame(){
  game.day=0;
  addLog('<span class="system-text">=== 游戏开始！15位三国豪杰入座 ===</span>');
  await delay(800);
  nightPhase();
}

async function nightPhase(){
  try{
  game.day++;
  game.isProcessing=true;
  game.wolfTarget=null;game.seerTarget=null;game.witchSave=false;game.witchPoison=null;game.guardTarget=null;
  game.speeches=[];
  setNight(true);
  setPhase(`第${game.day}夜`,"var(--purple)");
  addLog(`<span class="system-text">--- 第${game.day}夜 · 天黑请闭眼 ---</span>`);
  clearSelection();
  await delay(1000);

  // Guard
  await guardAction();
  await delay(600);

  // Wolves
  await wolfAction();
  await delay(600);

  // Seer
  await seerAction();
  await delay(600);

  // Witch
  await witchAction();
  await delay(600);

  // Resolve night
  resolveNight();
  }catch(e){
    addLog(`<span style="color:var(--red)">[系统错误] ${e.message}</span>`);
    console.error('nightPhase error:',e);
    await delay(1000);
    resolveNight();
  }
}

async function guardAction(){
  const guard=getAlive().find(p=>p.role==="guard"&&p.alive);
  if(!guard)return;
  const targets=getAlive().filter(p=>p.id!==game.lastGuardTarget);
  if(targets.length===0)return;
  // 政治高的守卫更懂得保护关键人物
  let target;
  const politic=getAttr(guard,'政治');
  if(politic>=4){
    // 优先保护特殊角色
    const specials=targets.filter(p=>["seer","witch"].includes(p.role));
    if(specials.length>0 && Math.random()<0.6) target=pick(specials);
  }
  if(!target) target=pick(targets);
  game.guardTarget=target.id;
  const guardTarget=game.players[game.guardTarget];
  addLog(`${speakerHTML(guard,"【守卫】"+guard.name)}<span class="night-text">守护了${guardTarget.name}……</span>`);
}

async function wolfAction(){
  const wolves=getAliveWolves();
  if(wolves.length===0)return;
  const targets=getAliveGood();
  if(targets.length===0)return;

  // ===== 识别关键角色 =====
  // 武力最高 = 行动决策者
  const killMaster=wolves.reduce((b,w)=>getAttr(w,'武力')>getAttr(b,'武力')?w:b);
  // 政治+智谋最高 = 剧本策划者
  const scriptMaster=wolves.reduce((b,w)=>attrScore(w,'政治','智谋')>attrScore(b,'政治','智谋')?w:b);

  addLog('<span class="system-text">🐺 狼人密议开始……</span>');
  await delay(800);

  // ===== 第一步：军师开场定调（提目标 + 建议刀谁 + 抛出剧本）=====
  while(game.isPaused) await delay(100);
  const proposals=[];
  // 军师先提目标
  const masterProposal=wolfProposeTarget(scriptMaster, targets);
  proposals.push(masterProposal);
  // 生成剧本（提前到这里）
  const script=generateWolfScript(scriptMaster, wolves, targets);
  game.wolfScript=script;
  game.wolfScriptCompliance={};
  // 军师发言：提目标 + 建议刀谁 + 剧本
  const masterTarget=masterProposal.target;
  const masterTpl=pick(WOLF_DISCUSS.propose).replace(/{t}/g,masterTarget.name).replace(/{faction}/g,masterTarget.faction);
  const killSuggestTargets=targets.filter(t=>["seer","witch","hunter"].includes(t.role));
  const killSuggest=killSuggestTargets.length>0 && Math.random()<0.6 ? pick(killSuggestTargets) : pick(targets);
  const killSuggestLine=`我建议今晚先动${killSuggest.name}，此人若留到后期必成大患。`;
  const scriptDesc=`【${script.name}】${script.desc}`;
  const scriptTpl=pick(WOLF_DISCUSS.script_propose).replace(/{script}/g,scriptDesc);
  addLog(`${speakerHTML(scriptMaster,'<span style="color:var(--red)">【军师】'+scriptMaster.name+'</span>')}${masterTpl} ${killSuggestLine}${scriptTpl}`);
  await delay(1000);

  // ===== 第二步：其他狼依次提出目标并附和/反对军师 =====
  const otherWolves=wolves.filter(w=>w.id!==scriptMaster.id);
  for(const wolf of otherWolves){
    while(game.isPaused) await delay(100);
    const proposal=wolfProposeTarget(wolf, targets);
    proposals.push(proposal);
    const t=proposal.target;
    // 与军师目标一致 → 附和；不一致 → 可能提出异议
    if(t.id===masterTarget.id){
      const tpl=pick(WOLF_DISCUSS.agree).replace(/{t}/g,t.name);
      const personalFlavor=generatePersonalSpeech(wolf, t.name);
      const speech=(personalFlavor&&Math.random()<0.3)?personalFlavor:tpl;
      addLog(`${speakerHTML(wolf,'<span style="color:var(--red)">【狼人密议】'+wolf.name+'</span>')}${speech}`);
    } else {
      // 意志高才敢公开反对军师
      if(Math.random()<getAttr(wolf,'意志')/5){
        const tpl=pick(WOLF_DISCUSS.disagree).replace(/{t}/g,t.name).replace(/{t2}/g,masterTarget.name);
        addLog(`${speakerHTML(wolf,'<span style="color:var(--red)">【狼人密议】'+wolf.name+'</span>')}${tpl}`);
      } else {
        // 表面附和但心里选了别人
        const tpl=pick(WOLF_DISCUSS.agree).replace(/{t}/g,masterTarget.name);
        addLog(`${speakerHTML(wolf,'<span style="color:var(--red)">【狼人密议】'+wolf.name+'</span>')}${tpl}`);
      }
    }
    await delay(800+Math.random()*500);
  }

  // ===== 第三步：狼人辩论（规则④统帅影响 + 好感度修正）=====
  for(const wolf of wolves){
    while(game.isPaused) await delay(100);
    if(wolf.id===killMaster.id) continue; // 行动决策者最后说话
    const myProposal=proposals.find(p=>p.wolfId===wolf.id);
    const others=proposals.filter(p=>p.wolfId!==wolf.id);
    if(others.length===0) continue;
    // 规则④：统帅越高，越能说服他人
    // 规则⑥：对发言者好感度越高，越容易被说服
    const leadership = getAttr(wolf, '统帅') / 6;
    // 用其他狼对当前狼的平均好感度修正说服概率
    const avgFavor = wolves.filter(w => w.id !== wolf.id)
      .reduce((s, w) => s + getFavor(w, wolf.id), 0) / (wolves.length - 1);
    const favorBonus = Math.max(0, (avgFavor - 50) * 0.008); // 好感度60 → +0.08
    if(Math.random() < leadership + favorBonus){
      const otherProposal=pick(others);
      const agree=myProposal.target.id===otherProposal.target.id;
      if(agree){
        const tpl=pick(WOLF_DISCUSS.agree).replace(/{t}/g,myProposal.target.name);
        addLog(`${speakerHTML(wolf,'<span style="color:var(--red)">【狼人密议】'+wolf.name+'</span>')}${tpl}`);
      } else {
        // 规则⑦：意志越高越坚持己见
        const insist=Math.random()<getAttr(wolf,'意志')/5;
        if(insist){
          const tpl=pick(WOLF_DISCUSS.disagree).replace(/{t}/g,myProposal.target.name).replace(/{t2}/g,otherProposal.target.name);
          addLog(`${speakerHTML(wolf,'<span style="color:var(--red)">【狼人密议】'+wolf.name+'</span>')}${tpl}`);
        }
      }
      await delay(600+Math.random()*400);
    }
  }

  // ===== 第四步：其他狼表态服从/抗命剧本（规则⑤政治 + 好感度 + 规则⑦意志）=====
  for(const wolf of wolves){
    while(game.isPaused) await delay(100);
    if(wolf.id===scriptMaster.id){ game.wolfScriptCompliance[wolf.id]=true; continue; }
    // 规则⑤：政治越高越服从剧本
    let compliance=getAttr(wolf,'政治')/5;
    // 对策划者好感度修正：好感度越高越服从
    const masterFavor = getFavor(wolf, scriptMaster.id);
    compliance += (masterFavor - 50) * 0.006; // 好感度60 → +0.06
    // 规则⑦：意志越高越不服从
    compliance -= (getAttr(wolf, '意志') - 3) * 0.08;
    compliance = Math.max(0.05, Math.min(0.95, compliance));
    const follows=Math.random()<compliance;
    game.wolfScriptCompliance[wolf.id]=follows;
    const tpl=follows?pick(WOLF_DISCUSS.script_accept):pick(WOLF_DISCUSS.script_reject);
    addLog(`${speakerHTML(wolf,'<span style="color:var(--red)">【狼人密议】'+wolf.name+'</span>')}${tpl}`);
    await delay(500);
  }

  // ===== 武力最高者决定最终行动 =====
  while(game.isPaused) await delay(100);
  const finalTarget=killMasterDecide(killMaster, proposals, targets);
  game.wolfTarget=finalTarget.id;
  const killTpl=pick(WOLF_DISCUSS.kill_decide).replace(/{t}/g,finalTarget.name);
  addLog(`${speakerHTML(killMaster,'<span style="color:var(--red)">【武力裁决】'+killMaster.name+'</span>')}${killTpl}`);
  await delay(600);

  addLog('<span class="system-text">🐺 狼人密议结束，目标已锁定。</span>');
}

// 狼人提出目标（规则①：好感度驱动，更愿意刀好感度低的人）
function wolfProposeTarget(wolf, targets) {
  // 按好感度加权：好感度越低，权重越高
  const weights = targets.map(t => {
    const f = getFavor(wolf, t.id);
    // 反转权重：好感度10 → 权重90，好感度90 → 权重10
    let w = Math.max(1, 100 - f);
    // 武力高的人更有主见，权重差距更大
    const martial = getAttr(wolf, '武力');
    if (martial >= 4) w = Math.pow(w, 1.3);
    return w;
  });

  // 加权随机选择
  const totalWeight = weights.reduce((s, w) => s + w, 0);
  let r = Math.random() * totalWeight;
  let target = targets[0];
  for (let i = 0; i < targets.length; i++) {
    r -= weights[i];
    if (r <= 0) { target = targets[i]; break; }
  }

  return { wolfId: wolf.id, target };
}

// 剧本策划者生成明日剧本
function generateWolfScript(scriptMaster, wolves, targets){
  // 根据局势选择剧本
  const alive=getAlive();
  const wolfCount=wolves.length;
  const goodCount=alive.length-wolfCount;
  const day=game.day;

  // 可选剧本
  let candidates=[...SCRIPT_TYPES];

  // 第1夜：悍跳或潜伏
  if(day===1){ candidates=candidates.filter(s=>['fake_seer','lay_low','aggressive'].includes(s.id)); }
  // 狼少时：潜伏或牺牲
  if(wolfCount<=2){ candidates=candidates.filter(s=>['lay_low','wolf_sacrifice','split_vote'].includes(s.id)); }
  // 剧本策划者智力高时更倾向复杂剧本
  if(getAttr(scriptMaster,'智谋')>=4){ candidates=candidates.filter(s=>!['lay_low'].includes(s.id)); if(candidates.length===0) candidates=[...SCRIPT_TYPES]; }

  const script=pick(candidates);

  // 指定角色分配
  script.assignedWolves={};
  const aliveWolves=[...wolves];
  if(script.id==='fake_seer' && aliveWolves.length>=1){
    script.assignedWolves.fakeSeer=aliveWolves.reduce((b,w)=>getAttr(w,'智谋')>getAttr(b,'智谋')?w:b);
  } else if(script.id==='wolf_fight' && aliveWolves.length>=2){
    shuffle(aliveWolves);
    script.assignedWolves.fighter1=aliveWolves[0];
    script.assignedWolves.fighter2=aliveWolves[1];
  } else if(script.id==='wolf_sacrifice' && aliveWolves.length>=2){
    script.assignedWolves.sacrifice=aliveWolves.reduce((b,w)=>getAttr(w,'魅力')<getAttr(b,'魅力')?w:b);
    script.assignedWolves.accuser=aliveWolves.reduce((b,w)=>getAttr(w,'智谋')>getAttr(b,'智谋')?w:b);
    if(script.assignedWolves.sacrifice.id===script.assignedWolves.accuser.id){
      script.assignedWolves.accuser=aliveWolves.find(w=>w.id!==script.assignedWolves.sacrifice.id)||script.assignedWolves.sacrifice;
    }
  }

  // 剧本中指定攻击目标
  const goodTargets=targets.filter(t=>t.role!=='wolf');
  script.target=goodTargets.length>0?pick(goodTargets):null;

  return script;
}

// 武力最高者决定最终目标
function killMasterDecide(killMaster, proposals, targets){
  // 武力最高者先看多数意见
  const voteCount={};
  for(const p of proposals){
    voteCount[p.target.id]=(voteCount[p.target.id]||0)+1;
  }
  // 找得票最多的目标
  let maxVotes=0, topTargets=[];
  for(let id in voteCount){
    if(voteCount[id]>maxVotes){ maxVotes=voteCount[id]; topTargets=[game.players[parseInt(id)]]; }
    else if(voteCount[id]===maxVotes){ topTargets.push(game.players[parseInt(id)]); }
  }
  // 武力最高者从高票目标中选（也可能坚持己见，意志越高越固执）
  const myChoice=proposals.find(p=>p.wolfId===killMaster.id);
  if(myChoice && Math.random()<getAttr(killMaster,'意志')/6){
    return myChoice.target;
  }
  return pick(topTargets);
}

async function seerAction(){
  const seer=getAlive().find(p=>p.role==="seer");
  if(!seer)return;
  const targets=getAlive().filter(p=>p.id!==seer.id&&p.role!=="seer");
  if(targets.length===0)return;
  // Smart: check suspicious people first
  let target=pick(targets);
  const unchecked=targets.filter(p=>!game.speeches.find(s=>s.speaker==="seer"&&s.about===p.id));
  if(unchecked.length>0) target=pick(unchecked);
  game.seerTarget=target.id;
  const isWolf=target.role==="wolf";
  addLog(`${speakerHTML(seer,"【预言家】"+seer.name)}查验了${target.name}——身份是：<b style="color:${isWolf?"var(--red)":"var(--green)"}">${isWolf?"狼人":"好人"}</b>`);
}

  if(!witch)return;
  const intel=getAttr(witch,'智谋');
  const politic=getAttr(witch,'政治');
  if(game.witchHasSave&&game.wolfTarget!==null){
    const victim=game.players[game.wolfTarget];
    if(victim.role==="witch"){} // can't self-save rule
    else {
      // 政治高的女巫更懂得保全关键人物
      let saveProb=0.5+politic*0.05;
      // 智谋高的女巫能判断被刀者是否重要
      if(intel>=4 && ["seer","hunter"].includes(victim.role)) saveProb+=0.2;
      if(Math.random()<saveProb){
        game.witchSave=true;
        game.witchHasSave=false;
        addLog(`${speakerHTML(witch,"【女巫】"+witch.name)}使用解药救下了${victim.name}！`);
        return;
      }
    }
  }
  if(game.witchHasPoison&&game.day>=2){
    // 智谋影响毒药精准度
    let poisonProb=0.2+intel*0.05;
    if(game.day>=3) poisonProb+=0.1;
    if(Math.random()<poisonProb){
      const wolves=getAliveWolves();
      if(wolves.length>0){
        const knownWolves=wolves.filter(w=>game.speeches.find(s=>s.speaker==="seer"&&s.about===w.id&&s.isWolf));
        if(knownWolves.length>0){
          game.witchPoison=pick(knownWolves).id;
        } else if(intel>=4){
          // 高智谋女巫能从发言中推断狼人
          const wolfSpeakers=wolves.filter(w=>game.speeches.some(s=>s.speakerId===w.id));
          if(wolfSpeakers.length>0) game.witchPoison=pick(wolfSpeakers).id;
        } else {
          const suspects=getAlive().filter(p=>p.role!=="witch"&&p.id!==witch.id);
          if(suspects.length>0) game.witchPoison=pick(suspects).id;
        }
        if(game.witchPoison!==null){
          game.witchHasPoison=false;
          addLog(`${speakerHTML(witch,"【女巫】"+witch.name)}悄悄使用了毒药……`);
        }
      }
    }
  }
}

function resolveNight(){
  let deaths=[];
  // Wolf kill
  if(game.wolfTarget!==null){
    let saved=false;
    if(game.guardTarget===game.wolfTarget) saved=true;
    if(game.witchSave) saved=true;
    if(!saved) deaths.push({id:game.wolfTarget,cause:"wolf"});
  }
  // Witch poison
  if(game.witchPoison!==null&&!deaths.find(d=>d.id===game.witchPoison)){
    deaths.push({id:game.witchPoison,cause:"poison"});
  }
  game.lastGuardTarget=game.guardTarget;

  game.isProcessing=false;
  setTimeout(()=>dayPhase(deaths),1200);
}

async function dayPhase(deaths){
  try{
  setNight(false);
  setPhase(`第${game.day}天`,"var(--gold)");
  addLog(`<span class="system-text">--- 第${game.day}天 · 天亮了 ---</span>`);
  await delay(800);

  // Announce deaths
  if(deaths.length===0){
    addLog('<span style="color:var(--green)">昨夜是平安夜，没有人死亡。</span>');
  } else {
    for(const d of deaths){
      const p=game.players[d.id];
      p.alive=false;
      const causeText=d.cause==="wolf"?"被狼人杀害":d.cause==="poison"?"被女巫毒杀":"死亡";
      addLog(`<span class="death-text">${p.name}（${p.faction}·${ROLE_CFG[p.role].name}）昨夜${causeText}了！</span>`);
      if(p.personality.length>0) addLog(`<span class="death-text" style="color:var(--gray)">"${p.name}遗言：${pick(p.personality)}……"</span>`);
      // Hunter shoot
      if(p.role==="hunter"&&d.cause!=="poison"){
        const target=pickExclude(getAlive(),[p.id]);
        if(target){
          target.alive=false;
          addLog(`<span class="death-text" style="color:var(--hunter)">${p.name}发动猎人技能，带走了${target.name}（${ROLE_CFG[target.role].name}）！</span>`);
          if(target.role==="hunter"&&getAlive().find(pp=>pp.role==="hunter"&&pp.id!==p.id)){/* chain handled */}
        }
      }
    }
  }

  renderPlayers();
  await delay(300);

  // Check win
  if(checkWin())return;

  // Discussion
  addLog('<span class="system-text">=== 进入讨论环节 ===</span>');
  await delay(600);
  // Discussion
  await generateSpeeches();
  await delay(600);

  // Vote
  await votePhase();
  }catch(e){
    addLog(`<span style="color:var(--red)">[系统错误] ${e.message}</span>`);
    console.error('dayPhase error:',e);
  }
}

async function generateSpeeches(){
  const alive=getAlive();
  const wolves=getAliveWolves();
  const script=game.wolfScript;

  // ===== 每天重置已发言集合 =====
  game.spokenToday=new Set();

  // ===== 收集本轮发言上下文（用于后面的角色引用前人发言）=====
  const speechContext=[]; // {speakerId, speakerName, targetName, text}

  for(const p of alive){
    while(game.isPaused) await delay(100);

    let speech="";
    // 选一个怀疑对象（排除自己）
    const suspectPool=alive.filter(x=>x.id!==p.id);

    if(p.role==="wolf"){
      // ===== 狼人发言：规则⑤剧本服从 + 规则①阵营偏好 =====
      const followsScript=game.wolfScriptCompliance[p.id]!==false;
      speech=generateWolfDaySpeech(p, alive, wolves, script, followsScript, speechContext, game.spokenToday);
    }
    else if(p.role==="seer"){
      // ===== 预言家发言：规则③智谋影响 =====
      speech=generateSeerSpeech(p, suspectPool, speechContext, game.spokenToday);
    }
    else {
      // ===== 好人发言：规则③④⑥⑦全部体现在发言内容 =====
      speech=generateGoodSpeech(p, suspectPool, speechContext, game.spokenToday);
    }

    // 人设风味（50%概率追加一句）
    const personalSpeech=generatePersonalSpeech(p, null);
    if(personalSpeech && Math.random()<0.5){
      speech+=" "+personalSpeech;
    }

    // 分类发言类型
    const classified = classifySpeech(speech, p, alive);
    const typeLabel = speechTypeLabel(classified);

    addLog(`${speakerHTML(p)}${speech}${typeLabel}`);

    // ===== 好感度影响 =====
    const favorChanges = applySpeechFavorEffect(p, speech, classified, alive, false);

    // 记录发言上下文
    const mentionedTarget=suspectPool.find(x=>speech.includes(x.name));
    speechContext.push({
      speakerId:p.id, speakerName:p.name,
      targetName:mentionedTarget?mentionedTarget.name:null,
      text:speech, role:p.role, speechType: classified.type
    });
    game.spokenToday.add(p.id);
    game.speeches.push({speaker:p.role,about:null,text:speech,speakerId:p.id,speechType:classified.type});
    await delay(800+Math.random()*700);
  }
}

// ===== 预言家发言：规则③智谋 =====
function generateSeerSpeech(seer, suspectPool, ctx, spokenSet){
  const intel=getAttr(seer,'智谋');

  // 已查验到狼人
  if(game.seerTarget!==null && game.players[game.seerTarget].role==="wolf"){
    const wt=game.players[game.seerTarget];
    // 智谋越高越果断亮身份
    if(intel>=4 || Math.random()<0.5){
      return pickTemplate("seer_reveal",{t:wt.name,r:"狼人"});
    }
    // 智谋低的不敢直接跳，先暗示
    return pickTemplate("seer_hint",{t:wt.name});
  }

  // 还没查到狼
  const t=pick(suspectPool);
  // 智谋高的会分析别人的发言（仅引用今天已发言的人）
  if(intel>=4 && ctx.length>0){
    const recentCtx=ctx.slice(-3);
    const spokeToday=recentCtx.filter(s=>spokenSet.has(s.speakerId));
    const suspiciousSpeeches = spokeToday.filter(s => s.role === "wolf" || (s.text && s.text.includes("我觉得")));
    if (suspiciousSpeeches.length > 0) {
      const s = pick(suspiciousSpeeches);
      return pickTemplate("seer_hint", { t: s.speakerName });
    }
  }
  return pickTemplate("seer_hint",{t:t.name});
}

// ===== 好人发言：规则③④⑥⑦通过发言内容体现 =====
function generateGoodSpeech(player, suspectPool, ctx, spokenSet){
  const intel=getAttr(player,'智谋');
  const leadership=getAttr(player,'统帅');
  const charm=getAttr(player,'魅力');
  const will=getAttr(player,'意志');

  // ===== 规则③ 智谋：分析别人发言的真伪 =====
  if(intel>=4 && ctx.length>0){
    // 高智谋：从前人发言中找破绽，点名质疑
    const analyzed=ctx.slice(-5);
    for(const s of analyzed){
      const speaker=game.players[s.speakerId];
      if(!speaker || !speaker.alive || speaker.id===player.id) continue;
      if(!spokenSet.has(speaker.id)) continue;
      // 发现前后矛盾或可疑发言
      if(s.text && (s.text.includes("不知道") || s.text.includes("不确定")) && s.text.includes("我觉得")){
        return `${speaker.name}，你刚才说不知道谁是狼，现在又觉得某人可疑？这话前后矛盾，你自己解释解释。`;
      }
    }
    // 没找到明显破绽，但能分析出重点怀疑对象
    const wolfSpeeches=ctx.filter(s=>s.role==="wolf" && spokenSet.has(s.speakerId));
    if(wolfSpeeches.length>0 && Math.random()<intel/5){
      const s=pick(wolfSpeeches);
      return `我仔细听了一下，${s.speakerName}的发言逻辑有点问题。感觉太完美了反而可疑。各位注意${s.speakerName}。`;
    }
  }

  // ===== 规则④ 统帅：引领讨论方向 =====
  if(leadership>=4){
    const target=pick(suspectPool);
    const templates=[
      `大家听我说，冷静分析一下局势。我认为现在最可疑的是${target.name}，理由如下——他的发言缺乏实质性内容，一直在搅浑水。我们应该集中火力先排查${target.name}。`,
      `各位别吵，听我分析。目前局势很清楚，${target.name}的表现最反常。我建议今天就投${target.name}，其他事后议。`,
      `我来说句公道话。${target.name}今天的发言你们仔细品品，是不是处处在带节奏？这种人在暗处最危险。`
    ];
    return pick(templates);
  }

  // ===== 规则⑦ 意志：被质疑时是否改口 =====
  // 检查有没有今天已发言的人质疑过自己
  const questioned=ctx.filter(s=>spokenSet.has(s.speakerId) && s.text && s.text.includes(player.name) && (s.text.includes("可疑") || s.text.includes("怀疑") || s.text.includes("投")));
  if(questioned.length>0 && Math.random()<0.5){
    const q=pick(questioned);
    if(will>=4){
      // 高意志：不退缩
      const target=pick(suspectPool);
      return `${q.speakerName}质疑我？随便。我坚持我的判断，${target.name}才是最可疑的那个。你们爱信不信。`;
    } else {
      // 低意志：改口
      const filtered=suspectPool.filter(x=>x.name!==q.speakerName);
      const target=filtered.length>0?pick(filtered):pick(suspectPool);
      return target?`也许${q.speakerName}说得有道理……我之前可能判断有误。我现在觉得${target.name}更可疑一些。`:`也许${q.speakerName}说得有道理……我再想想。`;
    }
  }

  // ===== 规则⑥ 魅力：高魅力不容易被人点名怀疑 =====
  // （这个规则体现在别人怀疑谁时回避高魅力者，这里不直接影响自己发言）
  // 但魅力低的发言更容易引起怀疑
  if(charm<=2){
    const target=pick(suspectPool);
    const templates=[
      `我……我觉得${target.name}有点问题吧？不太确定……`,
      `嗯……${target.name}看起来可疑？可能是我多心了……`,
      `那个，${target.name}是不是在说谎啊？我直觉告诉我的……`
    ];
    return pick(templates);
  }

  // ===== 普通发言 =====
  // 低智谋：划水为主，偶尔带情绪
  if(intel<=2){
    const target=pick(suspectPool);
    // 划水：不表态、不点名、观望态度
    const idleTemplates=[
      `唔……我也不太确定，先听听大家怎么说吧。`,
      `我没什么特别想说的，等我再观察观察。`,
      `嗯……大家都说得有道理，我暂时没什么判断。`,
      `说实话我脑子有点乱，这局太复杂了，我再想想。`,
      `我先不发表意见了，看看后面的人怎么说。`,
      `我啥也不懂，先苟着吧，谁可疑我跟着投就行。`
    ];
    // 偶尔（30%）会说带情绪的攻击性发言
    if(Math.random()<0.3){
      const emotionalTemplates=[
        `我就是觉得${target.name}有问题，别问我为什么，直觉！`,
        `不知道为啥，看${target.name}就不顺眼。投他！`,
        `我啥也不懂，但${target.name}说话让人不舒服，就投他吧。`
      ];
      return pick(emotionalTemplates);
    }
    return pick(idleTemplates);
  }

  // 中等属性：标准分析
  const target=pick(suspectPool);

  // 规则④中等统帅：可能引用前人的话（仅引用今天已发言的人）
  if(leadership>=3 && ctx.length>0){
    const recentCtx=ctx.filter(s=>s.speakerId!==player.id && spokenSet.has(s.speakerId));
    if(recentCtx.length>0){
      const ref=pick(recentCtx);
      return pickTemplate("villager_analyze",{t:target.name})+` 不过就像${ref.speakerName}说的，我们得冷静分析。`;
    }
  }

  return pickTemplate("villager_analyze",{t:target.name});
}

// 狼人白天发言：规则⑤剧本服从 + 规则①阵营偏好
function generateWolfDaySpeech(wolf, alive, wolves, script, followsScript, ctx, spokenSet){
  const innocents=alive.filter(x=>x.role!=="wolf"&&x.id!==wolf.id);

  // 规则①阵营偏好：更愿意指控不同阵营的人
  const diffFaction=innocents.filter(t=>t.faction!==wolf.faction);
  const target=diffFaction.length>0 && Math.random()<0.6 ? pick(diffFaction) : pick(innocents);

  // ===== 不服从剧本：按自己想法来 =====
  if(!script || !followsScript){
    // 魅力低的狼发言更冲，容易暴露
    if(getAttr(wolf,'魅力')<=2){
      return pickTemplate("wolf_accuse",{t:target.name})+" 你们谁不服？";
    }
    // 智谋高的抗命狼可能自己搞一套
    if(getAttr(wolf,'智谋')>=4){
      return pickTemplate("villager_analyze",{t:target.name});
    }
    return pickTemplate("wolf_accuse",{t:target.name});
  }

  // ===== 服从剧本 =====
  const assigned=script.assignedWolves||{};
  switch(script.id){
    case 'fake_seer':
      if(assigned.fakeSeer && wolf.id===assigned.fakeSeer.id){
        return pickTemplate("seer_reveal",{t:(script.target||target).name,r:"狼人"});
      }
      const tName = (script.target && spokenSet.has(script.target.id)) ? script.target.name : target.name;
      return `我觉得${tName}确实很可疑，发言有漏洞。`;

    case 'wolf_fight':
      if(assigned.fighter1 && wolf.id===assigned.fighter1.id){
        return pickTemplate("wolf_accuse",{t:assigned.fighter2.name});
      }
      if(assigned.fighter2 && wolf.id===assigned.fighter2.id){
        return pickTemplate("wolf_accuse",{t:assigned.fighter1.name});
      }
      return pickTemplate("villager_analyze",{t:target.name});

    case 'wolf_sacrifice':
      if(assigned.accuser && wolf.id===assigned.accuser.id){
        return pickTemplate("seer_reveal",{t:assigned.sacrifice.name,r:"狼人"});
      }
      if(assigned.sacrifice && wolf.id===assigned.sacrifice.id){
        return pickTemplate("wolf_defend",{t:assigned.accuser.name});
      }
      // 其他狼配合投票
      return `我同意，${assigned.sacrifice?assigned.sacrifice.name:target.name}确实有问题。投他。`;

    case 'lay_low':
      return pickTemplate("generic",{});

    case 'aggressive':
      return pickTemplate("wolf_accuse",{t:(script.target||target).name});

    case 'split_vote':
      return pickTemplate("villager_analyze",{t:target.name});

    default:
      return pickTemplate("wolf_accuse",{t:target.name});
  }
}

async function votePhase(){
  addLog('<span class="system-text">=== 投票环节 ===</span>');
  await delay(600);

  const alive=getAlive();
  const votes={};

  for(const p of alive){
    while(game.isPaused) await delay(100);

    // ===== 一人一票：好感度 + 发言综合决策 =====
    const suspectPool=alive.filter(x=>x.id!==p.id);
    const suspectScores={};

    for(const x of suspectPool){
      let score = 0;

      // 1) 好感度基础分：好感度越低越想投（规则①）
      const f = getFavor(p, x.id);
      score += Math.max(0, (50 - f) * 0.5); // 好感度30 → +10分，好感度70 → -10分

      // 2) 发言中被怀疑的次数
      for(const s of game.speeches){
        if(s.text && s.text.includes(x.name) && (s.text.includes("可疑")||s.text.includes("投")||s.text.includes("狼")||s.text.includes("质疑")||s.text.includes("矛盾")||s.text.includes("有问题"))){
          score += 3;
        }
      }

      // 3) 预言家查到的狼加大量分（规则③：智谋高的更相信预言家）
      if(p.role==="seer" && game.seerTarget!==null){
        const known=game.players[game.seerTarget];
        if(x.id===known.id && known.role==="wolf" && known.alive){
          score += 50; // 预言家铁定投查到的狼
        }
      }

      // 4) 狼人倾向投好人（规则① + 剧本）
      if(p.role==="wolf" && x.role!=="wolf"){
        score += 8;
        // 如果服从剧本且剧本指定了集火目标
        if(game.wolfScriptCompliance[p.id] && game.wolfScript && game.wolfScript.target){
          if(x.id===game.wolfScript.target) score += 15;
        }
      }

      // 5) 智谋修正：智谋高的玩家更能判断（规则③）
      const intel=getAttr(p,'智谋');
      if(intel>=4){
        // 高智谋更依赖发言线索，降低好感度权重的影响
        score *= 1.2;
      }

      // 6) 政治修正：政治高的更倾向跟随主流（规则⑤）
      const politic=getAttr(p,'政治');
      if(politic>=4){
        // 政治高：如果此人是多人怀疑的目标，额外加分
        const accuseCount=game.speeches.filter(s=>s.text&&s.text.includes(x.name)&&(s.text.includes("可疑")||s.text.includes("狼")||s.text.includes("有问题"))).length;
        if(accuseCount>=2) score += accuseCount*3;
      }

      suspectScores[x.id] = score;
    }

    // 加权随机选择投票目标（分高概率大）
    let target;
    const validTargets=suspectPool.filter(x=>suspectScores[x.id]>0);
    if(validTargets.length>0){
      const weights=validTargets.map(x=>Math.max(1, suspectScores[x.id]));
      const totalW=weights.reduce((s,w)=>s+w,0);
      let r=Math.random()*totalW;
      for(let i=0;i<validTargets.length;i++){
        r-=weights[i];
        if(r<=0){target=validTargets[i];break;}
      }
      if(!target)target=validTargets[validTargets.length-1];
    }else{
      target=pick(suspectPool);
    }

    if(target){
      votes[target.id]=(votes[target.id]||0)+1;
      addLog(`${speakerHTML(p)}<span class="vote-text">→ ${target.name}</span>`);
    }
    await delay(400);
  }

  await delay(600);
  // Find max votes
  let maxVotes=0,maxId=null;
  for(let id in votes){if(votes[id]>maxVotes){maxVotes=votes[id];maxId=parseInt(id)}}

  if(maxId!==null){
    const exiled=game.players[maxId];
    exiled.alive=false;
    addLog(`<span class="death-text" style="font-size:15px">${exiled.name}（${ROLE_CFG[exiled.role].name}）以${maxVotes}票被放逐！</span>`);
    if(exiled.personality.length>0) addLog(`<span class="death-text" style="color:var(--gray)">"${exiled.name}：${pick(exiled.personality)}……"</span>`);

    // Hunter
    if(exiled.role==="hunter"){
      const targets=getAlive().filter(p=>p.id!==exiled.id);
      if(targets.length>0){
        // 智谋高的猎人更精准
        const ht=getAttr(exiled,'智谋')>=4 ? (targets.filter(t=>t.role==="wolf").length>0 ? pick(targets.filter(t=>t.role==="wolf")) : pick(targets)) : pick(targets);
        if(ht){
          ht.alive=false;
          addLog(`<span class="death-text" style="color:var(--hunter)">${exiled.name}发动猎人技能，带走了${ht.name}（${ROLE_CFG[ht.role].name}）！</span>`);
        }
      }
    }
  }

  renderPlayers();
  await delay(500);

  if(!checkWin()){
    await delay(500);
    nightPhase();
  }
}

function checkWin(){
  const wolves=getAliveWolves().length;
  const good=getAliveGood().length;

  if(wolves===0){
    endGame("good");return true;
  }
  if(wolves>=good){
    endGame("wolf");return true;
  }
  return false;
}

function endGame(winner){
  const isGood=winner==="good";
  const title=isGood?"好人阵营胜利！":"狼人阵营胜利！";
  const color=isGood?"var(--green)":"var(--red)";
  const wolves=game.players.filter(p=>p.role==="wolf");

  setPhase("游戏结束",color);

  let summary=`<h2 style="color:${color}">${title}</h2><p style="margin-bottom:16px">${isGood?"所有狼人已被铲除，三国重归太平！":"狼人控制了局势，黑暗笼罩大地！"}</p>`;
  summary+=`<div style="text-align:left;padding:12px;background:rgba(0,0,0,0.3);border-radius:8px;font-size:13px">`;
  summary+=`<div style="margin-bottom:8px;color:var(--gold);font-weight:700">身份揭晓：</div>`;
  for(const p of game.players){
    const status=p.alive?"<span style='color:var(--green)'>存活</span>":"<span style='color:var(--red)'>阵亡</span>";
    const imgSrc = (FACTION_DIR[p.faction] || "avatars/qun") + '/' + p.name + '.png';
    summary+=`<div style="padding:3px 0;display:flex;align-items:center;justify-content:space-between;gap:8px">
      <span style="display:flex;align-items:center;gap:6px"><img src="${imgSrc}" onerror="this.style.display='none'" style="width:22px;height:22px;border-radius:50%" alt="${p.name}">${p.name}（${p.faction}）</span>
      <span style="display:flex;align-items:center;gap:6px"><span style="color:${ROLE_CFG[p.role].color}">${ROLE_CFG[p.role].name}</span>${status}</span>
    </div>`;
  }
  summary+=`</div><br><button class="btn-primary" onclick="location.reload()">再来一局</button>`;

  document.getElementById("modalArea").innerHTML=`<div class="modal-overlay"><div class="modal">${summary}</div></div>`;
}

function onPlayerClick(id){
  if(game.isProcessing)return;
  const p=game.players[id];
  if(!p.alive)return;
  document.querySelectorAll(".p-card").forEach(c=>c.classList.remove("selected"));
  document.getElementById("pc"+id).classList.add("selected");
  game.selectedPlayer=id;
}

function clearSelection(){
  game.selectedPlayer=null;
  document.querySelectorAll(".p-card").forEach(c=>{c.classList.remove("selected");c.classList.remove("wolf-glow")});
}

init();
</script>
</body>
</html>
