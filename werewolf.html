<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>三国狼人杀</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#1a1a2e;--bg2:#16213e;--card:#0f3460;--gold:#e2b714;--red:#c0392b;--blue:#2980b9;--green:#27ae60;--purple:#8e44ad;--white:#ecf0f1;--gray:#7f8c8d;--dark:#2c3e50;--wolf:#c0392b;--seer:#3498db;--witch:#9b59b6;--hunter:#e67e22;--guard:#2ecc71;--villager:#95a5a6}
body{font-family:'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--white);min-height:100vh;overflow-x:hidden}
.header{text-align:center;padding:20px;background:linear-gradient(135deg,var(--bg2),var(--card));border-bottom:2px solid var(--gold)}
.header h1{font-size:28px;color:var(--gold);text-shadow:0 0 10px rgba(226,183,20,0.3)}
.header p{color:var(--gray);font-size:14px;margin-top:4px}
.phase-bar{display:flex;justify-content:center;gap:4px;padding:12px;background:var(--bg2)}
.phase-dot{width:12px;height:12px;border-radius:50%;background:var(--gray);opacity:0.3;transition:all 0.3s}
.phase-dot.active{opacity:1;box-shadow:0 0 8px currentColor}
.game-area{max-width:900px;margin:0 auto;padding:20px;display:flex;gap:20px}
.players-panel{flex:0 0 280px}
.game-main{flex:1;min-width:0}
.card{background:var(--bg2);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:16px;margin-bottom:12px}
.card h3{color:var(--gold);font-size:14px;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.player-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.p-card{background:var(--card);border-radius:10px;padding:8px;text-align:center;cursor:pointer;transition:all 0.3s;border:2px solid transparent;position:relative}
.p-card:hover{transform:translateY(-2px);border-color:var(--gold)}
.p-card.dead{opacity:0.4;pointer-events:none;filter:grayscale(1)}
.p-card.selected{border-color:var(--gold);box-shadow:0 0 12px rgba(226,183,20,0.4)}
.p-card.wolf-glow{border-color:var(--wolf);box-shadow:0 0 12px rgba(192,57,43,0.4)}
.p-card .avatar{width:40px;height:40px;border-radius:50%;margin:0 auto 4px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;overflow:hidden;background:var(--card)}
.p-card .avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.p-card .name{font-size:12px;font-weight:700}
.p-card .faction{font-size:10px;color:var(--gray)}
.p-card .role-badge{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;font-size:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700}
.p-card .status-icon{position:absolute;top:4px;left:4px;font-size:10px}
.faction-wei .avatar{background:linear-gradient(135deg,#1a5276,#2980b9)}
.faction-shu .avatar{background:linear-gradient(135deg,#145a32,#27ae60)}
.faction-wu .avatar{background:linear-gradient(135deg,#7d3c98,#a569bd)}
.faction-qun .avatar{background:linear-gradient(135deg,#935116,#d4ac0d)}
.log-area{max-height:400px;overflow-y:auto;padding:8px}
.log-entry{padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.05);font-size:13px;line-height:1.6;animation:fadeIn 0.3s}
.log-entry .speaker{color:var(--gold);font-weight:700;margin-right:4px}
.log-entry .night-text{color:var(--gray);font-style:italic}
.log-entry .death-text{color:var(--red)}
.log-entry .vote-text{color:var(--blue)}
.log-entry .system-text{color:var(--purple);font-weight:700}
@keyframes fadeIn{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:translateY(0)}}
.action-bar{padding:12px;text-align:center}
.action-bar button{padding:10px 24px;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;transition:all 0.2s;margin:0 4px}
.action-bar button:hover{transform:scale(1.05)}
.action-bar button:disabled{opacity:0.4;cursor:not-allowed;transform:none}
.btn-primary{background:var(--gold);color:var(--bg)}
.btn-danger{background:var(--red);color:#fff}
.btn-blue{background:var(--blue);color:#fff}
.btn-green{background:var(--green);color:#fff}
.btn-purple{background:var(--purple);color:#fff}
.btn-pause{position:fixed;top:12px;right:12px;z-index:300;padding:8px 18px;border:2px solid var(--gold);border-radius:20px;background:rgba(15,52,96,0.95);color:var(--gold);font-size:13px;font-weight:700;cursor:pointer;transition:all 0.2s;backdrop-filter:blur(4px)}
.btn-pause:hover{background:var(--gold);color:var(--bg);transform:scale(1.05)}
.btn-pause.paused{border-color:var(--red);color:var(--red)}
.btn-pause.paused:hover{background:var(--red);color:#fff}
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;z-index:100}
.modal{background:var(--bg2);border:2px solid var(--gold);border-radius:16px;padding:24px;max-width:500px;width:90%;text-align:center}
.modal h2{color:var(--gold);font-size:22px;margin-bottom:12px}
.modal p{color:var(--white);font-size:14px;line-height:1.8;margin-bottom:16px}
.modal .highlight{color:var(--gold);font-weight:700}
.role-reveal{text-align:center;padding:20px}
.role-reveal .role-icon{font-size:48px;margin-bottom:12px}
.role-reveal .role-name{font-size:24px;font-weight:700;margin-bottom:8px}
.role-reveal .role-desc{color:var(--gray);font-size:14px}
.vote-result{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.vote-tag{background:rgba(255,255,255,0.1);border-radius:4px;padding:2px 8px;font-size:12px}
.night-overlay{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:50;transition:background 1s}
.night-overlay.is-night{background:rgba(0,0,10,0.5)}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--gold);border-radius:8px;padding:10px 20px;font-size:14px;z-index:200;animation:toastIn 0.3s}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(-20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.witch-panel{text-align:left}
.witch-panel h4{margin:8px 0 4px;color:var(--gold);font-size:13px}
.witch-options{display:flex;gap:8px;flex-wrap:wrap}
.witch-btn{padding:6px 14px;border-radius:6px;border:1px solid var(--gold);background:transparent;color:var(--gold);cursor:pointer;font-size:13px}
.witch-btn:hover{background:var(--gold);color:var(--bg)}
.witch-btn.used{opacity:0.3;pointer-events:none}
.info-bar{display:flex;justify-content:space-between;padding:8px 12px;background:var(--bg2);border-radius:8px;font-size:13px;margin-bottom:12px}
.info-bar span{color:var(--gray)}
.info-bar .num{color:var(--gold);font-weight:700}
.speaker{display:inline-flex;align-items:center;gap:6px;vertical-align:middle;font-weight:700;margin-right:4px}
.speaker img{width:28px;height:28px;border-radius:50%;border:2px solid rgba(255,255,255,0.2);object-fit:cover;flex-shrink:0;background:var(--card)}

/* ===== 移动端适配 ===== */
@media(max-width:768px){
  .header{padding:14px}
  .header h1{font-size:22px}
  .header p{font-size:12px}
  .phase-bar{padding:8px}
  .game-area{flex-direction:column;padding:10px;gap:12px}
  .players-panel{flex:none;width:100%}
  .player-grid{grid-template-columns:repeat(5,1fr);gap:6px}
  .p-card{padding:6px}
  .p-card .avatar{width:32px;height:32px;font-size:14px}
  .p-card .name{font-size:10px}
  .p-card .faction{font-size:9px}
  .p-card .role-badge{width:16px;height:16px;font-size:8px;top:-4px;right:-4px}
  .p-card .status-icon{font-size:8px}
  .log-area{max-height:45vh;font-size:12px}
  .log-entry{font-size:12px;line-height:1.5}
  .speaker img{width:22px;height:22px;border-width:1px}
  .card{padding:10px;margin-bottom:8px}
  .card h3{font-size:12px}
  .action-bar button{padding:8px 16px;font-size:13px}
  .info-bar{font-size:11px;padding:6px 8px}
  .btn-pause{top:8px;right:8px;padding:6px 14px;font-size:12px}
  .modal{padding:16px;width:92%}
  .modal h2{font-size:18px}
  .modal p{font-size:13px}
  .role-reveal .role-icon{font-size:36px}
  .role-reveal .role-name{font-size:20px}
}
</style>
</head>

</div>

<script src="characters_data.js"></script>

// ===== 属性辅助函数 =====
function getAttr(p, name) {
  return (p.attrs && p.attrs[name]) || 3;
}
function attrScore(p) {
  let s = 0; for (let i = 1; i < arguments.length; i++) s += getAttr(p, arguments[i]); return s;
}

// 根据性格特征动态生成人设发言
function generatePersonalSpeech(p, targetName) {
  const traits = p.personality || [];
  const t = targetName || '某人';
  if (traits.length === 0) return null;
  const trait = pick(traits);
  const templates = [

}

  return new Promise(resolve=>{
    const check=()=>{
      if(game.isPaused){
        game.pauseResolvers.push(()=>setTimeout(check,50));

  });
}

function init(){
  // 从 219 人的角色库中随机抽取 15 人
  const pool = shuffle([...ALL_CHARS]);
  const selected = pool.slice(0, 15);

  let roles=[];
  for(let r in ROLE_CFG) for(let i=0;i<ROLE_CFG[r].count;i++) roles.push(r);
  shuffle(roles);
  game.players = selected.map((c,i) => ({
    ...c,
    id: i,
    role: roles[i],
    alive: true,
    votedFor: null
  }));
  renderPlayers();
  showStartModal();
}

async function guardAction(){
  const guard=getAlive().find(p=>p.role==="guard"&&p.alive);
  if(!guard)return;
  const targets=getAlive().filter(p=>p.id!==game.lastGuardTarget);
  if(targets.length===0)return;
  // 政治高的守卫更懂得保护关键人物
  let target;
  const politic=getAttr(guard,'政治');
  if(politic>=4){
    // 优先保护特殊角色
    const specials=targets.filter(p=>["seer","witch"].includes(p.role));
    if(specials.length>0 && Math.random()<0.6) target=pick(specials);
  }
  if(!target) target=pick(targets);
  game.guardTarget=target.id;
  const guardTarget=game.players[game.guardTarget];
  addLog(`${speakerHTML(guard,"【守卫】"+guard.name)}<span class="night-text">守护了${guardTarget.name}……</span>`);
}

async function wolfAction(){
  const wolves=getAliveWolves();
  if(wolves.length===0)return;
  const targets=getAliveGood();
  if(targets.length===0)return;

  // ===== 识别关键角色 =====
  // 武力最高 = 行动决策者
  const killMaster=wolves.reduce((b,w)=>getAttr(w,'武力')>getAttr(b,'武力')?w:b);
  // 政治+智谋最高 = 剧本策划者
  const scriptMaster=wolves.reduce((b,w)=>attrScore(w,'政治','智谋')>attrScore(b,'政治','智谋')?w:b);

  addLog('<span class="system-text">🐺 狼人密议开始……</span>');
  await delay(800);

  // ===== 每只狼提出目标（阵营偏好）=====
  const proposals=[];
  for(const wolf of wolves){
    while(game.isPaused) await delay(100);
    const proposal=wolfProposeTarget(wolf, targets);
    proposals.push(proposal);
    const t=proposal.target;
    const tpl=pick(WOLF_DISCUSS.propose).replace(/{t}/g,t.name).replace(/{faction}/g,t.faction);
    const personalFlavor=generatePersonalSpeech(wolf, t.name);
    const speech=(personalFlavor&&Math.random()<0.4)?personalFlavor:tpl;
    addLog(`${speakerHTML(wolf,'<span style="color:var(--red)">【狼人密议】'+wolf.name+'</span>')}${speech}`);
    await delay(800+Math.random()*500);
  }

  // ===== 狼人讨论辩论（统帅影响）=====
  // 统帅越高，越能说服他人
  for(const wolf of wolves){
    while(game.isPaused) await delay(100);
    if(wolf.id===killMaster.id) continue; // 行动决策者最后说话
    const myProposal=proposals.find(p=>p.wolfId===wolf.id);
    const others=proposals.filter(p=>p.wolfId!==wolf.id);
    if(others.length===0) continue;
    // 高统帅狼有概率尝试说服
    if(Math.random()<getAttr(wolf,'统帅')/6){
      const otherProposal=pick(others);
      const agree=myProposal.target.id===otherProposal.target.id;
      if(agree){
        const tpl=pick(WOLF_DISCUSS.agree).replace(/{t}/g,myProposal.target.name);
        addLog(`${speakerHTML(wolf,'<span style="color:var(--red)">【狼人密议】'+wolf.name+'</span>')}${tpl}`);
      } else {
        // 意志越高越坚持己见
        const insist=Math.random()<getAttr(wolf,'意志')/5;
        if(insist){
          const tpl=pick(WOLF_DISCUSS.disagree).replace(/{t}/g,myProposal.target.name).replace(/{t2}/g,otherProposal.target.name);
          addLog(`${speakerHTML(wolf,'<span style="color:var(--red)">【狼人密议】'+wolf.name+'</span>')}${tpl}`);
        }
      }
      await delay(600+Math.random()*400);
    }
  }

  // ===== 剧本策划者提出明日剧本 =====
  while(game.isPaused) await delay(100);
  const script=generateWolfScript(scriptMaster, wolves, targets);
  game.wolfScript=script;
  game.wolfScriptCompliance={};
  // 军师建议今晚刀谁 + 明日剧本
  const killSuggestTargets=targets.filter(t=>["seer","witch","hunter"].includes(t.role));
  const killSuggest=killSuggestTargets.length>0 && Math.random()<0.6 ? pick(killSuggestTargets) : pick(targets);
  const killSuggestLine=`我建议今晚先动${killSuggest.name}，此人若留到后期必成大患。`;
  const scriptDesc=`【${script.name}】${script.desc}`;
  const scriptTpl=pick(WOLF_DISCUSS.script_propose).replace(/{script}/g,scriptDesc);
  addLog(`${speakerHTML(scriptMaster,'<span style="color:var(--red)">【狼人密议】'+scriptMaster.name+'</span>')}${killSuggestLine}${scriptTpl}`);
  await delay(800);

  // ===== 每只狼决定是否服从剧本 =====
  for(const wolf of wolves){
    while(game.isPaused) await delay(100);
    if(wolf.id===scriptMaster.id){ game.wolfScriptCompliance[wolf.id]=true; continue; }
    // 政治越高越服从剧本
    const compliance=getAttr(wolf,'政治')/5;
    const follows=Math.random()<compliance;
    game.wolfScriptCompliance[wolf.id]=follows;
    const tpl=follows?pick(WOLF_DISCUSS.script_accept):pick(WOLF_DISCUSS.script_reject);
    addLog(`${speakerHTML(wolf,'<span style="color:var(--red)">【狼人密议】'+wolf.name+'</span>')}${tpl}`);
    await delay(500);
  }

  // ===== 武力最高者决定最终行动 =====
  while(game.isPaused) await delay(100);
  const finalTarget=killMasterDecide(killMaster, proposals, targets);
  game.wolfTarget=finalTarget.id;
  const killTpl=pick(WOLF_DISCUSS.kill_decide).replace(/{t}/g,finalTarget.name);
  addLog(`${speakerHTML(killMaster,'<span style="color:var(--red)">【武力裁决】'+killMaster.name+'</span>')}${killTpl}`);
  await delay(600);

  addLog('<span class="system-text">🐺 狼人密议结束，目标已锁定。</span>');
}

// 狼人提出目标（阵营偏好）
function wolfProposeTarget(wolf, targets){
  const diffFaction=targets.filter(t=>t.faction!==wolf.faction);
  const sameFaction=targets.filter(t=>t.faction===wolf.faction);
  // 规则1: 更愿意刀不同阵营的人，概率按属性加权
  let target;
  if(diffFaction.length>0 && Math.random()<(0.5+getAttr(wolf,'意志')*0.1)){
    target=pick(diffFaction);
  } else {
    target=pick(targets);
  }
  return {wolfId:wolf.id, target:target};
}

// 剧本策划者生成明日剧本
function generateWolfScript(scriptMaster, wolves, targets){
  // 根据局势选择剧本
  const alive=getAlive();
  const wolfCount=wolves.length;
  const goodCount=alive.length-wolfCount;
  const day=game.day;

  // 可选剧本
  let candidates=[...SCRIPT_TYPES];

  // 第1夜：悍跳或潜伏
  if(day===1){ candidates=candidates.filter(s=>['fake_seer','lay_low','aggressive'].includes(s.id)); }
  // 狼少时：潜伏或牺牲
  if(wolfCount<=2){ candidates=candidates.filter(s=>['lay_low','wolf_sacrifice','split_vote'].includes(s.id)); }
  // 剧本策划者智力高时更倾向复杂剧本
  if(getAttr(scriptMaster,'智谋')>=4){ candidates=candidates.filter(s=>!['lay_low'].includes(s.id)); if(candidates.length===0) candidates=[...SCRIPT_TYPES]; }

  const script=pick(candidates);

  // 指定角色分配
  script.assignedWolves={};
  const aliveWolves=[...wolves];
  if(script.id==='fake_seer' && aliveWolves.length>=1){
    script.assignedWolves.fakeSeer=aliveWolves.reduce((b,w)=>getAttr(w,'智谋')>getAttr(b,'智谋')?w:b);
  } else if(script.id==='wolf_fight' && aliveWolves.length>=2){
    shuffle(aliveWolves);
    script.assignedWolves.fighter1=aliveWolves[0];
    script.assignedWolves.fighter2=aliveWolves[1];
  } else if(script.id==='wolf_sacrifice' && aliveWolves.length>=2){
    script.assignedWolves.sacrifice=aliveWolves.reduce((b,w)=>getAttr(w,'魅力')<getAttr(b,'魅力')?w:b);
    script.assignedWolves.accuser=aliveWolves.reduce((b,w)=>getAttr(w,'智谋')>getAttr(b,'智谋')?w:b);
    if(script.assignedWolves.sacrifice.id===script.assignedWolves.accuser.id){
      script.assignedWolves.accuser=aliveWolves.find(w=>w.id!==script.assignedWolves.sacrifice.id)||script.assignedWolves.sacrifice;
    }
  }

  // 剧本中指定攻击目标
  const goodTargets=targets.filter(t=>t.role!=='wolf');
  script.target=goodTargets.length>0?pick(goodTargets):null;

  return script;
}

// 武力最高者决定最终目标
function killMasterDecide(killMaster, proposals, targets){
  // 武力最高者先看多数意见
  const voteCount={};
  for(const p of proposals){
    voteCount[p.target.id]=(voteCount[p.target.id]||0)+1;
  }
  // 找得票最多的目标
  let maxVotes=0, topTargets=[];
  for(let id in voteCount){
    if(voteCount[id]>maxVotes){ maxVotes=voteCount[id]; topTargets=[game.players[parseInt(id)]]; }
    else if(voteCount[id]===maxVotes){ topTargets.push(game.players[parseInt(id)]); }
  }
  // 武力最高者从高票目标中选（也可能坚持己见，意志越高越固执）
  const myChoice=proposals.find(p=>p.wolfId===killMaster.id);
  if(myChoice && Math.random()<getAttr(killMaster,'意志')/6){
    return myChoice.target;
  }
  return pick(topTargets);
}

async function seerAction(){
  const seer=getAlive().find(p=>p.role==="seer");
  if(!seer)return;
  const targets=getAlive().filter(p=>p.id!==seer.id&&p.role!=="seer");
  if(targets.length===0)return;
  // Smart: check suspicious people first
  let target=pick(targets);
  const unchecked=targets.filter(p=>!game.speeches.find(s=>s.speaker==="seer"&&s.about===p.id));
  if(unchecked.length>0) target=pick(unchecked);
  game.seerTarget=target.id;
  const isWolf=target.role==="wolf";
  addLog(`${speakerHTML(seer,"【预言家】"+seer.name)}查验了${target.name}——身份是：<b style="color:${isWolf?"var(--red)":"var(--green)"}">${isWolf?"狼人":"好人"}</b>`);
}

async function witchAction(){
  const witch=getAlive().find(p=>p.role==="witch");
  if(!witch)return;
  const intel=getAttr(witch,'智谋');
  const politic=getAttr(witch,'政治');
  if(game.witchHasSave&&game.wolfTarget!==null){
    const victim=game.players[game.wolfTarget];
    if(victim.role==="witch"){} // can't self-save rule
    else {
      // 政治高的女巫更懂得保全关键人物
      let saveProb=0.5+politic*0.05;
      // 智谋高的女巫能判断被刀者是否重要
      if(intel>=4 && ["seer","hunter"].includes(victim.role)) saveProb+=0.2;
      if(Math.random()<saveProb){
        game.witchSave=true;
        game.witchHasSave=false;
        addLog(`${speakerHTML(witch,"【女巫】"+witch.name)}使用解药救下了${victim.name}！`);
        return;
      }
    }
  }
  if(game.witchHasPoison&&game.day>=2){
    // 智谋影响毒药精准度
    let poisonProb=0.2+intel*0.05;
    if(game.day>=3) poisonProb+=0.1;
    if(Math.random()<poisonProb){
      const wolves=getAliveWolves();
      if(wolves.length>0){
        const knownWolves=wolves.filter(w=>game.speeches.find(s=>s.speaker==="seer"&&s.about===w.id&&s.isWolf));
        if(knownWolves.length>0){
          game.witchPoison=pick(knownWolves).id;
        } else if(intel>=4){
          // 高智谋女巫能从发言中推断狼人
          const wolfSpeakers=wolves.filter(w=>game.speeches.some(s=>s.speakerId===w.id));
          if(wolfSpeakers.length>0) game.witchPoison=pick(wolfSpeakers).id;
        } else {
          const suspects=getAlive().filter(p=>p.role!=="witch"&&p.id!==witch.id);
          if(suspects.length>0) game.witchPoison=pick(suspects).id;
        }
        if(game.witchPoison!==null){
          game.witchHasPoison=false;
          addLog(`${speakerHTML(witch,"【女巫】"+witch.name)}悄悄使用了毒药……`);
        }
      }
    }
  }
}

function resolveNight(){
  let deaths=[];
  // Wolf kill
  if(game.wolfTarget!==null){
    let saved=false;
    if(game.guardTarget===game.wolfTarget) saved=true;
    if(game.witchSave) saved=true;
    if(!saved) deaths.push({id:game.wolfTarget,cause:"wolf"});
  }
  // Witch poison
  if(game.witchPoison!==null&&!deaths.find(d=>d.id===game.witchPoison)){
    deaths.push({id:game.witchPoison,cause:"poison"});
  }
  game.lastGuardTarget=game.guardTarget;

  game.isProcessing=false;
  setTimeout(()=>dayPhase(deaths),1200);
}

async function dayPhase(deaths){
  try{
  setNight(false);
  setPhase(`第${game.day}天`,"var(--gold)");
  addLog(`<span class="system-text">--- 第${game.day}天 · 天亮了 ---</span>`);
  await delay(800);

  // Announce deaths
  if(deaths.length===0){
    addLog('<span style="color:var(--green)">昨夜是平安夜，没有人死亡。</span>');
  } else {
    for(const d of deaths){
      const p=game.players[d.id];
      p.alive=false;
      const causeText=d.cause==="wolf"?"被狼人杀害":d.cause==="poison"?"被女巫毒杀":"死亡";
      addLog(`<span class="death-text">${p.name}（${p.faction}·${ROLE_CFG[p.role].name}）昨夜${causeText}了！</span>`);
      if(p.personality.length>0) addLog(`<span class="death-text" style="color:var(--gray)">"${p.name}遗言：${pick(p.personality)}……"</span>`);
      // Hunter shoot
      if(p.role==="hunter"&&d.cause!=="poison"){
        const target=pickExclude(getAlive(),[p.id]);
        if(target){
          target.alive=false;
          addLog(`<span class="death-text" style="color:var(--hunter)">${p.name}发动猎人技能，带走了${target.name}（${ROLE_CFG[target.role].name}）！</span>`);
          if(target.role==="hunter"&&getAlive().find(pp=>pp.role==="hunter"&&pp.id!==p.id)){/* chain handled */}
        }
      }
    }
  }

  renderPlayers();
  await delay(300);

  // Check win
  if(checkWin())return;

  // Discussion
  addLog('<span class="system-text">=== 进入讨论环节 ===</span>');
  await delay(600);
  // Discussion
  await generateSpeeches();
  await delay(600);

  // Vote
  await votePhase();
  }catch(e){
    addLog(`<span style="color:var(--red)">[系统错误] ${e.message}</span>`);
    console.error('dayPhase error:',e);
  }
}

async function generateSpeeches(){
  const alive=getAlive();
  const wolves=getAliveWolves();
  const script=game.wolfScript;

  // ===== 收集本轮发言上下文（用于后面的角色引用前人发言）=====
  const speechContext=[]; // {speakerId, speakerName, targetName, text}

  for(const p of alive){
    while(game.isPaused) await delay(100);

    let speech="";
    // 选一个怀疑对象（排除自己）
    const suspectPool=alive.filter(x=>x.id!==p.id);

    if(p.role==="wolf"){
      // ===== 狼人发言：规则⑤剧本服从 + 规则①阵营偏好 =====
      const followsScript=game.wolfScriptCompliance[p.id]!==false;
      speech=generateWolfDaySpeech(p, alive, wolves, script, followsScript, speechContext);
    }
    else if(p.role==="seer"){
      // ===== 预言家发言：规则③智谋影响 =====
      speech=generateSeerSpeech(p, suspectPool, speechContext);
    }
    else {
      // ===== 好人发言：规则③④⑥⑦全部体现在发言内容 =====
      speech=generateGoodSpeech(p, suspectPool, speechContext);
    }

    // 人设风味（50%概率追加一句）
    const personalSpeech=generatePersonalSpeech(p, null);
    if(personalSpeech && Math.random()<0.5){
      speech+=" "+personalSpeech;
    }

    addLog(`${speakerHTML(p)}${speech}`);
    // 记录发言上下文
    const mentionedTarget=suspectPool.find(x=>speech.includes(x.name));
    speechContext.push({
      speakerId:p.id, speakerName:p.name,
      targetName:mentionedTarget?mentionedTarget.name:null,
      text:speech, role:p.role
    });
    game.speeches.push({speaker:p.role,about:null,text:speech,speakerId:p.id});
    await delay(800+Math.random()*700);
  }
}

// ===== 预言家发言：规则③智谋 =====
function generateSeerSpeech(seer, suspectPool, ctx){
  const intel=getAttr(seer,'智谋');

  // 已查验到狼人
  if(game.seerTarget!==null && game.players[game.seerTarget].role==="wolf"){
    const wt=game.players[game.seerTarget];
    // 智谋越高越果断亮身份
    if(intel>=4 || Math.random()<0.5){
      return pickTemplate("seer_reveal",{t:wt.name,r:"狼人"});
    }
    // 智谋低的不敢直接跳，先暗示
    return pickTemplate("seer_hint",{t:wt.name});
  }

  // 还没查到狼
  const t=pick(suspectPool);
  // 智谋高的会分析别人的发言
  if(intel>=4 && ctx.length>0){
    const recentCtx=ctx.slice(-3);
    const suspiciousSpeeches = recentCtx.filter(s => s.role === "wolf" || (s.text && s.text.includes("我觉得")));
    if (suspiciousSpeeches.length > 0) {
      const s = pick(suspiciousSpeeches);
      return pickTemplate("seer_hint", { t: s.speakerName });
    }
  }
  return pickTemplate("seer_hint",{t:t.name});
}

// ===== 好人发言：规则③④⑥⑦通过发言内容体现 =====
function generateGoodSpeech(player, suspectPool, ctx){
  const intel=getAttr(player,'智谋');
  const leadership=getAttr(player,'统帅');
  const charm=getAttr(player,'魅力');
  const will=getAttr(player,'意志');

  // ===== 规则③ 智谋：分析别人发言的真伪 =====
  if(intel>=4 && ctx.length>0){
    // 高智谋：从前人发言中找破绽，点名质疑
    const analyzed=ctx.slice(-5);
    for(const s of analyzed){
      const speaker=game.players[s.speakerId];
      if(!speaker || !speaker.alive || speaker.id===player.id) continue;
      // 发现前后矛盾或可疑发言
      if(s.text && (s.text.includes("不知道") || s.text.includes("不确定")) && s.text.includes("我觉得")){
        return `${speaker.name}，你刚才说不知道谁是狼，现在又觉得某人可疑？这话前后矛盾，你自己解释解释。`;
      }
    }
    // 没找到明显破绽，但能分析出重点怀疑对象
    const wolfSpeeches=ctx.filter(s=>s.role==="wolf");
    if(wolfSpeeches.length>0 && Math.random()<intel/5){
      const s=pick(wolfSpeeches);
      return `我仔细听了一下，${s.speakerName}的发言逻辑有点问题。他说的每一句话都像精心准备过的，太完美了反而可疑。各位注意${s.speakerName}。`;
    }
  }

  // ===== 规则④ 统帅：引领讨论方向 =====
  if(leadership>=4){
    const target=pick(suspectPool);
    const templates=[
      `大家听我说，冷静分析一下局势。我认为现在最可疑的是${target.name}，理由如下——他的发言缺乏实质性内容，一直在搅浑水。我们应该集中火力先排查${target.name}。`,
      `各位别吵，听我分析。目前局势很清楚，${target.name}的表现最反常。我建议今天就投${target.name}，其他事后议。`,
      `我来说句公道话。${target.name}今天的发言你们仔细品品，是不是处处在带节奏？这种人在暗处最危险。`
    ];
    return pick(templates);
  }

  // ===== 规则⑦ 意志：被质疑时是否改口 =====
  // 检查有没有人质疑过自己
  const questioned=ctx.filter(s=>s.text && s.text.includes(player.name) && (s.text.includes("可疑") || s.text.includes("怀疑") || s.text.includes("投")));
  if(questioned.length>0 && Math.random()<0.5){
    const q=pick(questioned);
    if(will>=4){
      // 高意志：不退缩
      const target=pick(suspectPool);
      return `${q.speakerName}质疑我？随便。我坚持我的判断，${target.name}才是最可疑的那个。你们爱信不信。`;
    } else {
      // 低意志：改口
      const filtered=suspectPool.filter(x=>x.name!==q.speakerName);
      const target=filtered.length>0?pick(filtered):pick(suspectPool);
      return target?`也许${q.speakerName}说得有道理……我之前可能判断有误。我现在觉得${target.name}更可疑一些。`:`也许${q.speakerName}说得有道理……我再想想。`;
    }
  }

  // ===== 规则⑥ 魅力：高魅力不容易被人点名怀疑 =====
  // （这个规则体现在别人怀疑谁时回避高魅力者，这里不直接影响自己发言）
  // 但魅力低的发言更容易引起怀疑
  if(charm<=2){
    const target=pick(suspectPool);
    const templates=[
      `我……我觉得${target.name}有点问题吧？不太确定……`,
      `嗯……${target.name}看起来可疑？可能是我多心了……`,
      `那个，${target.name}是不是在说谎啊？我直觉告诉我的……`
    ];
    return pick(templates);
  }

  // ===== 普通发言 =====
  // 低智谋：感性发言
  if(intel<=2){
    const target=pick(suspectPool);
    const templates=[
      `我就是觉得${target.name}有问题，别问我为什么，直觉！`,
      `不知道为啥，看${target.name}就不顺眼。投他！`,
      `我啥也不懂，但${target.name}说话让人不舒服，就投他吧。`
    ];
    return pick(templates);
  }

  // 中等属性：标准分析
  const target=pick(suspectPool);

  // 规则④中等统帅：可能引用前人的话
  if(leadership>=3 && ctx.length>0){
    const recentCtx=ctx.filter(s=>s.speakerId!==player.id);
    if(recentCtx.length>0){
      const ref=pick(recentCtx);
      return pickTemplate("villager_analyze",{t:target.name})+` 不过就像${ref.speakerName}说的，我们得冷静分析。`;
    }
  }

  return pickTemplate("villager_analyze",{t:target.name});
}

// 狼人白天发言：规则⑤剧本服从 + 规则①阵营偏好
function generateWolfDaySpeech(wolf, alive, wolves, script, followsScript, ctx){
  const innocents=alive.filter(x=>x.role!=="wolf"&&x.id!==wolf.id);

  // 规则①阵营偏好：更愿意指控不同阵营的人
  const diffFaction=innocents.filter(t=>t.faction!==wolf.faction);
  const target=diffFaction.length>0 && Math.random()<0.6 ? pick(diffFaction) : pick(innocents);

  // ===== 不服从剧本：按自己想法来 =====
  if(!script || !followsScript){
    // 魅力低的狼发言更冲，容易暴露
    if(getAttr(wolf,'魅力')<=2){
      return pickTemplate("wolf_accuse",{t:target.name})+" 你们谁不服？";
    }
    // 智谋高的抗命狼可能自己搞一套
    if(getAttr(wolf,'智谋')>=4){
      return pickTemplate("villager_analyze",{t:target.name});
    }
    return pickTemplate("wolf_accuse",{t:target.name});
  }

  // ===== 服从剧本 =====
  const assigned=script.assignedWolves||{};
  switch(script.id){
    case 'fake_seer':
      if(assigned.fakeSeer && wolf.id===assigned.fakeSeer.id){
        return pickTemplate("seer_reveal",{t:(script.target||target).name,r:"狼人"});
      }
      return `我觉得${script.target?script.target.name:target.name}确实很可疑，刚才的发言漏洞百出。`;

    case 'wolf_fight':
      if(assigned.fighter1 && wolf.id===assigned.fighter1.id){
        return pickTemplate("wolf_accuse",{t:assigned.fighter2.name});
      }
      if(assigned.fighter2 && wolf.id===assigned.fighter2.id){
        return pickTemplate("wolf_accuse",{t:assigned.fighter1.name});
      }
      return pickTemplate("villager_analyze",{t:target.name});

    case 'wolf_sacrifice':
      if(assigned.accuser && wolf.id===assigned.accuser.id){
        return pickTemplate("seer_reveal",{t:assigned.sacrifice.name,r:"狼人"});
      }
      if(assigned.sacrifice && wolf.id===assigned.sacrifice.id){
        return pickTemplate("wolf_defend",{t:assigned.accuser.name});
      }
      // 其他狼配合投票
      return `我同意，${assigned.sacrifice?assigned.sacrifice.name:target.name}确实有问题。投他。`;

    case 'lay_low':
      return pickTemplate("generic",{});

    case 'aggressive':
      return pickTemplate("wolf_accuse",{t:(script.target||target).name});

    case 'split_vote':
      return pickTemplate("villager_analyze",{t:target.name});

    default:
      return pickTemplate("wolf_accuse",{t:target.name});
  }
}

async function votePhase(){
  addLog('<span class="system-text">=== 投票环节 ===</span>');
  await delay(600);

  const alive=getAlive();
  const votes={};

  for(const p of alive){
    while(game.isPaused) await delay(100);

    // ===== 一人一票：根据发言内容决定投谁 =====
    // 预言家查到狼就投狼
    let target;
    if(p.role==="seer" && game.seerTarget!==null){
      const known=game.players[game.seerTarget];
      if(known.alive && known.role==="wolf") target=known;
    }
    // 否则根据本轮发言中谁被怀疑最多来投
    if(!target){
      const suspectPool=alive.filter(x=>x.id!==p.id);
      // 统计发言中被点名怀疑的人
      const accuseCount={};
      for(const s of game.speeches){
        for(const x of suspectPool){
          if(s.text && s.text.includes(x.name) && (s.text.includes("可疑")||s.text.includes("投")||s.text.includes("狼")||s.text.includes("质疑")||s.text.includes("矛盾")||s.text.includes("有问题"))){
            accuseCount[x.id]=(accuseCount[x.id]||0)+1;
          }
        }
      }
      // 智谋越高，越能根据发言投对人
      const intel=getAttr(p,'智谋');
      if(intel>=4 && Object.keys(accuseCount).length>0){
        // 高智谋：投被最多人怀疑的
        let maxAcc=0, bestId=null;
        for(let id in accuseCount){ if(accuseCount[id]>maxAcc){maxAcc=accuseCount[id];bestId=parseInt(id)} }
        if(bestId!==null) target=game.players[bestId];
      }
      // 狼人投好人
      if(!target && p.role==="wolf"){
        const goodTargets=suspectPool.filter(x=>x.role!=="wolf");
        if(goodTargets.length>0) target=pick(goodTargets);
      }
      // 兜底
      if(!target) target=pick(suspectPool);
    }

    if(target){
      votes[target.id]=(votes[target.id]||0)+1;
      addLog(`${speakerHTML(p)}<span class="vote-text">→ ${target.name}</span>`);
    }
    await delay(400);
  }

  await delay(600);
  // Find max votes
  let maxVotes=0,maxId=null;
  for(let id in votes){if(votes[id]>maxVotes){maxVotes=votes[id];maxId=parseInt(id)}}

  if(maxId!==null){
    const exiled=game.players[maxId];
    exiled.alive=false;
    addLog(`<span class="death-text" style="font-size:15px">${exiled.name}（${ROLE_CFG[exiled.role].name}）以${maxVotes}票被放逐！</span>`);
    if(exiled.personality.length>0) addLog(`<span class="death-text" style="color:var(--gray)">"${exiled.name}：${pick(exiled.personality)}……"</span>`);

    // Hunter
    if(exiled.role==="hunter"){
      const targets=getAlive().filter(p=>p.id!==exiled.id);
      if(targets.length>0){
        // 智谋高的猎人更精准
        const ht=getAttr(exiled,'智谋')>=4 ? (targets.filter(t=>t.role==="wolf").length>0 ? pick(targets.filter(t=>t.role==="wolf")) : pick(targets)) : pick(targets);
        if(ht){
          ht.alive=false;
          addLog(`<span class="death-text" style="color:var(--hunter)">${exiled.name}发动猎人技能，带走了${ht.name}（${ROLE_CFG[ht.role].name}）！</span>`);
        }
      }
    }
  }

  renderPlayers();
  await delay(500);

  if(!checkWin()){
    await delay(500);
    nightPhase();
  }
}

function checkWin(){
  const wolves=getAliveWolves().length;
  const good=getAliveGood().length;

  if(wolves===0){
    endGame("good");return true;
  }
  if(wolves>=good){
    endGame("wolf");return true;
  }
  return false;
}

function endGame(winner){
  const isGood=winner==="good";
  const title=isGood?"好人阵营胜利！":"狼人阵营胜利！";
  const color=isGood?"var(--green)":"var(--red)";
  const wolves=game.players.filter(p=>p.role==="wolf");

  setPhase("游戏结束",color);

  let summary=`<h2 style="color:${color}">${title}</h2><p style="margin-bottom:16px">${isGood?"所有狼人已被铲除，三国重归太平！":"狼人控制了局势，黑暗笼罩大地！"}</p>`;
  summary+=`<div style="text-align:left;padding:12px;background:rgba(0,0,0,0.3);border-radius:8px;font-size:13px">`;
  summary+=`<div style="margin-bottom:8px;color:var(--gold);font-weight:700">身份揭晓：</div>`;
  for(const p of game.players){
    const status=p.alive?"<span style='color:var(--green)'>存活</span>":"<span style='color:var(--red)'>阵亡</span>";
    const imgSrc = (FACTION_DIR[p.faction] || "avatars/qun") + '/' + p.name + '.png';
    summary+=`<div style="padding:3px 0;display:flex;align-items:center;justify-content:space-between;gap:8px">
      <span style="display:flex;align-items:center;gap:6px"><img src="${imgSrc}" onerror="this.style.display='none'" style="width:22px;height:22px;border-radius:50%" alt="${p.name}">${p.name}（${p.faction}）</span>
      <span style="display:flex;align-items:center;gap:6px"><span style="color:${ROLE_CFG[p.role].color}">${ROLE_CFG[p.role].name}</span>${status}</span>
    </div>`;
  }
  summary+=`</div><br><button class="btn-primary" onclick="location.reload()">再来一局</button>`;

  document.getElementById("modalArea").innerHTML=`<div class="modal-overlay"><div class="modal">${summary}</div></div>`;
}

function onPlayerClick(id){
  if(game.isProcessing)return;
  const p=game.players[id];
  if(!p.alive)return;
  document.querySelectorAll(".p-card").forEach(c=>c.classList.remove("selected"));
  document.getElementById("pc"+id).classList.add("selected");
  game.selectedPlayer=id;
}

function clearSelection(){
  game.selectedPlayer=null;
  document.querySelectorAll(".p-card").forEach(c=>{c.classList.remove("selected");c.classList.remove("wolf-glow")});
}

init();
</script>
